let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('phoneToast');
  if (!el) return;
  const cls = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : 'bg-[#1E3A8A] text-white';
  el.className = `toast-bar rounded-xl px-3.5 py-2.5 text-xs font-medium shadow-lg flex items-center gap-2 ${cls}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(msg)}</span>`;
  el.classList.remove('hidden');
  lucide.createIcons({ nodes: [el] });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

function navigate(screenId, opts = {}) {
  if (opts.key && opts.val) state.selected[opts.key] = opts.val;
  if (!opts.skipHistory && state.screen !== screenId) {
    state.history.push(state.screen);
    if (state.history.length > 25) state.history.shift();
  }
  state.activeSheet = null;
  state.screen = screenId;

  if (screenId === 'create-plan' || screenId === 'edit-plan') {
    const r = getReady(state.selected.proId);
    const d = getDel(state.selected.delId);
    state.planDraft = screenId === 'edit-plan'
      ? { mode: 'edit', id: d.id, method: d.method, qty: d.qty, vehicleId: d.vehicleId || 'VEH-01', driverName: d.driverName, driverPhone: d.driverPhone, providerId: d.providerId || 'PROV-01', trackingNo: d.trackingNo, estExpense: d.estExpense, dispatchDate: d.plannedDispatch, deliveryDate: d.plannedDelivery, address: d.address, paymentArr: d.paymentArrangement }
      : { mode: 'create', proId: r.proId, method: 'Own Vehicle', qty: Math.max(1, r.approvedQty - r.plannedQty || r.approvedQty), vehicleId: 'VEH-02', driverName: 'Selvam K', driverPhone: '+91 98407 11220', providerId: 'PROV-01', trackingNo: '', estExpense: 3000, dispatchDate: todayStr(), deliveryDate: r.expectedDelivery, address: r.address, paymentArr: r.paymentTerms };
  } else if (screenId === 'vehicle-select-sheet') state.activeSheet = { type: 'select-veh' };
  else if (screenId === 'provider-select-sheet') state.activeSheet = { type: 'select-prov' };

  state.viewMode = 'phone';
  renderAll();
}

function goBack(fallback = 'dashboard') {
  state.activeSheet = null;
  state.screen = state.history.length ? state.history.pop() : fallback;
  renderAll();
}

function renderTopBar(title, opts = {}) {

  return `<div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between gap-2 shrink-0"><div class="flex items-center gap-2 min-w-0">${back}<h1 class="text-[15px] font-semibold text-slate-900 truncate">${esc(title)}</h1></div><div class="flex items-center gap-1.5 shrink-0">${opts.right || ''}</div></div>`;
}

function renderBottomNav(active) {
  const tabs = [['home', 'Home', 'home', 'dashboard'], ['orders', 'Orders', 'package', 'orders-hub'], ['dispatch', 'Dispatch', 'truck', 'dispatch-hub'], ['tracking', 'Tracking', 'map-pin', 'tracking-list'], ['more', 'More', 'grid', 'more']];
  return `<nav class="bg-white border-t border-slate-200 px-1 pt-1.5 pb-2 grid grid-cols-5 shrink-0">${tabs.map(([id, lbl, ic, sc]) => `<button type="button" data-nav="${sc}" class="flex flex-col items-center justify-center gap-0.5 py-0.5 rounded-lg ${id === active ? 'text-[#1E3A8A] font-semibold' : 'text-slate-500 hover:text-slate-800'}"><i data-lucide="${ic}" class="w-4.5 h-4.5 ${id === active ? 'stroke-[2.3]' : ''}"></i><span class="text-[10px]">${lbl}</span></button>`).join('')}</nav>`;

function renderStickyAction(html) {
  return `<div class="bg-white border-t border-slate-200 px-4 py-3 flex items-center gap-2.5 shrink-0">${html}</div>`;
}

function renderDelStepper(activeStep, nextTip) {
  const steps = [[1, 'Plan'], [2, 'Pack'], [3, 'Dispatch'], [4, 'Transit'], [5, 'POD']];
  return `<div class="bg-white border border-slate-200 rounded-xl p-3 space-y-2"><div class="flex items-center justify-between">${steps.map(([n, lbl], idx) => {
    const done = n < activeStep, curr = n === activeStep;
    return `<div class="flex items-center ${idx < steps.length - 1 ? 'flex-1' : ''}"><div class="flex flex-col items-center gap-0.5 shrink-0"><span class="w-6 h-6 rounded-full text-[11px] font-bold flex items-center justify-center ${done ? 'bg-emerald-600 text-white' : curr ? 'bg-[#1E3A8A] text-white ring-4 ring-blue-100' : 'bg-slate-100 text-slate-400 border border-slate-200'}">${done ? '✓' : n}</span><span class="text-[10px] ${curr ? 'font-bold text-[#1E3A8A]' : done ? 'text-emerald-700 font-medium' : 'text-slate-400'}">${lbl}</span></div>${idx < steps.length - 1 ? `<div class="h-0.5 flex-1 mx-1 -mt-4 ${done ? 'bg-emerald-500' : 'bg-slate-200'}"></div>` : ''}</div>`;
  }).join('')}</div>${nextTip ? `<div class="bg-blue-50/80 border border-blue-100 rounded-lg px-2.5 py-1.5 text-[11px] text-[#1E3A8A] flex items-center gap-1.5"><i data-lucide="compass" class="w-3.5 h-3.5 shrink-0"></i><span><strong>Next step:</strong> ${esc(nextTip)}</span></div>` : ''}</div>`;
}

function delStepNum(st) {
  return ({ 'Planned': 1, 'Packing': 2, 'Ready to Dispatch': 3, 'In Transit': 4, 'Delayed': 4, 'Delivery Failed': 4, 'Delivered': 5 })[st] || 1;
}

/* ---------- EVENTS ---------- */
document.getElementById('modePhoneBtn').addEventListener('click', () => { state.viewMode = 'phone'; renderAll(); });
document.getElementById('modeGalleryBtn').addEventListener('click', () => { state.viewMode = 'gallery'; renderAll(); });
document.getElementById('modeFlowBtn').addEventListener('click', () => { state.viewMode = 'workflow'; renderAll(); });
document.getElementById('sbModeFlowBtn').addEventListener('click', () => { state.sidebarMode = 'flow'; renderSidebar(); });
document.getElementById('sbModeAllBtn').addEventListener('click', () => { state.sidebarMode = 'all'; renderSidebar(); });
document.getElementById('sidebarSearch').addEventListener('input', () => renderSidebar());

const sidebarEl = document.getElementById('screenSidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('toggleSidebarBtn').addEventListener('click', () => { sidebarEl.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });

document.addEventListener('click', (e) => {
  const sb = e.target.closest('[data-sidebar-screen]');
  if (sb) { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); navigate(sb.dataset.sidebarScreen); return; }
  const gc = e.target.closest('[data-gallery-cat]');
  if (gc) { state.galleryCategory = gc.dataset.galleryCat; renderGallery(); return; }
  const go = e.target.closest('[data-gallery-open]');
  if (go) { navigate(go.dataset.galleryOpen); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  const opn = e.target.closest('[data-open]');
  if (opn) { navigate(opn.dataset.open, { key: opn.dataset.key, val: opn.dataset.val }); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === 'go-back') goBack(btn.dataset.fallback || 'dashboard');
  else if (act === 'close-sheet') { state.activeSheet = null; renderSheet(); }
  else if (act === 'open-sheet') { state.activeSheet = { type: btn.dataset.sheet }; renderSheet(); }
  else if (act === 'toast') showToast(btn.dataset.msg);
  else if (act === 'call') showToast(`Calling ${btn.dataset.name} (${btn.dataset.phone})...`);
  else if (act === 'plan-method') { state.planDraft.method = btn.dataset.val; renderAll(); }
  else if (act === 'pick-veh') { if (state.planDraft) state.planDraft.vehicleId = btn.dataset.id; state.activeSheet = null; renderAll(); showToast('Vehicle selected'); }
  else if (act === 'pick-prov') { if (state.planDraft) state.planDraft.providerId = btn.dataset.id; state.activeSheet = null; renderAll(); showToast('Provider selected'); }
  else if (act === 'save-plan') {
    const d = state.planDraft;
    if (d.mode === 'edit') {
      const del = getDel(d.id);
      del.method = d.method; del.vehicleId = d.vehicleId; del.providerId = d.providerId;
      del.plannedDelivery = document.getElementById('plDate')?.value || del.plannedDelivery;
      del.address = document.getElementById('plAddr')?.value || del.address;
      navigate('plan-details', { key: 'delId', val: del.id }); showToast(`${del.id} updated`);
    } else {
      const r = getReady(d.proId);
      const newId = `DEL-00${state.deliveries.length + 1}`;
      state.deliveries.unshift({
        id: newId, soId: r.soId, proId: r.proId, pkgId: `PKG-00${state.deliveries.length + 1}`, dcId: `DC-00${state.deliveries.length + 1}`, dspId: `DSP-00${state.deliveries.length + 1}`,
        customer: r.customer, contact: r.contact, phone: r.phone, address: document.getElementById('plAddr')?.value || r.address, destination: r.destination,
        product: r.product, model: r.model, qty: Number(document.getElementById('plQty')?.value) || r.approvedQty, deliveredQty: 0,
        plannedDispatch: todayStr(), plannedDelivery: document.getElementById('plDate')?.value || r.expectedDelivery, actualDelivery: '',
        method: d.method, vehicleId: d.vehicleId, driverName: document.getElementById('plDrvName')?.value || 'Selvam K', driverPhone: document.getElementById('plDrvPhone')?.value || '',
        providerId: d.providerId, trackingNo: document.getElementById('plTrack')?.value || '', status: 'Planned', packingStatus: 'Pending', packages: 1, packageType: 'Wooden Crate', weight: '—', challanStatus: 'Draft',
        orderAmount: r.orderAmount, receivedAmount: r.receivedAmount, collectOnDelivery: Math.max(0, r.orderAmount - r.receivedAmount), paymentArrangement: r.paymentTerms, paymentVerified: true,
        estExpense: Number(document.getElementById('plExp')?.value) || 3000, expenses: [], reportedLocation: 'Cryo Plant', lastUpdated: todayStr(), delayReason: '', receiverName: '', podSigned: false, trackingHistory: []
      });
      r.status = 'Planned'; r.plannedQty = r.approvedQty;
      navigate('plan-details', { key: 'delId', val: newId }); showToast(`${newId} delivery plan saved`);
    }
  } else if (act === 'save-veh') {
    const reg = (document.getElementById('vReg')?.value || '').trim();
    if (!reg) { showToast('Registration number required', 'error'); return; }
    if (btn.dataset.mode === 'edit') {
      Object.assign(getVeh(state.selected.vehId), { regNo: reg, type: document.getElementById('vType')?.value, model: document.getElementById('vModel')?.value, capacity: document.getElementById('vCap')?.value, notes: document.getElementById('vNotes')?.value });
      navigate('vehicle-details'); showToast('Vehicle updated');
    } else {
      const nv = { id: `VEH-0${state.vehicles.length + 1}`, regNo: reg, type: document.getElementById('vType')?.value || 'Mini Truck', model: document.getElementById('vModel')?.value || '', capacity: document.getElementById('vCap')?.value || '', status: 'Available', currentDel: '', notes: document.getElementById('vNotes')?.value || '' };
      state.vehicles.unshift(nv); navigate('vehicles-list'); showToast(`${reg} added to Vehicles Master`);
    }
  } else if (act === 'toggle-veh-avail') {
    const v = getVeh(btn.dataset.id); v.status = v.status === 'Available' ? 'Maintenance' : 'Available'; renderAll(); showToast(`${v.regNo} marked ${v.status}`);
  } else if (act === 'save-prov') {
    const name = (document.getElementById('prName')?.value || '').trim();
    if (!name) { showToast('Company name required', 'error'); return; }
    if (btn.dataset.mode === 'edit') {
      Object.assign(getProv(state.selected.provId), { name, type: document.getElementById('prType')?.value, phone: document.getElementById('prPhone')?.value, trackingUrl: document.getElementById('prUrl')?.value });
      navigate('provider-details'); showToast('Provider updated');
    } else {
      state.providers.unshift({ id: `PROV-0${state.providers.length + 1}`, name, type: document.getElementById('prType')?.value || 'Road Transport', contact: '', phone: document.getElementById('prPhone')?.value || '', email: '', trackingUrl: document.getElementById('prUrl')?.value || '', address: '' });
      navigate('providers-list'); showToast(`${name} added to Providers Master`);
    }
  } else if (act === 'verify-pay') { getDel(btn.dataset.id).paymentVerified = true; navigate('plan-details'); showToast('Payment terms verified'); }
  else if (act === 'save-cust-pay') {
    const d = getDel(btn.dataset.id); const amt = Number(document.getElementById('cpAmt')?.value) || 0;
    if (amt <= 0) { showToast('Enter valid amount', 'error'); return; }
    d.receivedAmount = Math.min(d.orderAmount, d.receivedAmount + amt);
    d.collectOnDelivery = Math.max(0, d.orderAmount - d.receivedAmount);
    navigate('payment-details', { key: 'delId', val: d.id }); showToast(`Recorded ${fmtINR(amt)} & synced with Sales`);
  } else if (act === 'confirm-pack') {
    const d = getDel(btn.dataset.id); d.packingStatus = 'Packed'; d.status = 'Ready to Dispatch';
    d.packages = Number(document.getElementById('pkCount')?.value) || d.packages;
    d.packageType = document.getElementById('pkType')?.value || d.packageType;
    navigate('packing-details', { key: 'delId', val: d.id }); showToast(`${d.pkgId} packing confirmed`);
  } else if (act === 'confirm-dispatch') {
    const d = getDel(btn.dataset.id); d.status = 'In Transit'; d.challanStatus = 'Dispatched';
    if (d.vehicleId) getVeh(d.vehicleId).status = 'In Transit';
    navigate(d.method === 'Own Vehicle' ? 'track-own' : 'track-courier', { key: 'delId', val: d.id });
    showToast(`${d.id} dispatched — Now In Transit!`);
  } else if (act === 'save-track-status') {
    const d = getDel(btn.dataset.id); const st = document.getElementById('usStatus')?.value;
    d.reportedLocation = document.getElementById('usLoc')?.value || d.reportedLocation;
    d.lastUpdated = 'Just now';
    if (st === 'Delivered') { navigate('delivery-confirm', { key: 'delId', val: d.id }); return; }
    d.status = st; navigate(d.method === 'Own Vehicle' ? 'track-own' : 'track-courier', { key: 'delId', val: d.id });
    showToast(`Status updated to ${st}`);
  } else if (act === 'confirm-reschedule') {
    const d = getDel(btn.dataset.id); d.plannedDelivery = document.getElementById('rsDate')?.value || d.plannedDelivery; d.status = 'In Transit';
    navigate('tracking-list'); showToast(`${d.id} rescheduled to ${d.plannedDelivery}`);
  } else if (act === 'save-failed') {
    const d = getDel(btn.dataset.id); d.status = 'Delivery Failed';
    navigate(document.getElementById('dfNext')?.value === 'return' ? 'product-return' : 'reschedule', { key: 'delId', val: d.id });
    showToast('Delivery failure recorded');
  } else if (act === 'confirm-pod') {
    const d = getDel(btn.dataset.id);
    d.deliveredQty = Number(document.getElementById('podAcc')?.value) || d.qty;
    d.receiverName = document.getElementById('podRecBy')?.value || d.contact;
    d.actualDelivery = todayStr(); d.podSigned = true; d.status = 'Delivered';
    const codPaid = Number(document.getElementById('podPay')?.value) || 0;
    if (codPaid > 0) { d.receivedAmount = Math.min(d.orderAmount, d.receivedAmount + codPaid); d.collectOnDelivery = Math.max(0, d.orderAmount - d.receivedAmount); }
    if (d.vehicleId) { const v = getVeh(d.vehicleId); v.status = 'Available'; v.currentDel = ''; }
    navigate('delivery-success', { key: 'delId', val: d.id });
  } else if (act === 'save-exp') {
    const d = getDel(btn.dataset.id);
    d.expenses.push({ type: document.getElementById('exType')?.value || 'Other', amount: Number(document.getElementById('exAmt')?.value) || 0, date: todayStr(), paidBy: 'Company', status: document.getElementById('exStat')?.value || 'Paid' });
    navigate('expense-details', { key: 'delId', val: d.id }); showToast('Delivery expense added');
  } else if (act === 'save-tp') {
    const d = getDel(btn.dataset.id); d.expenses.forEach((e) => { e.status = 'Paid'; });
    navigate('expense-details', { key: 'delId', val: d.id }); showToast('Transport payment recorded');
  } else if (act === 'open-notif') {
    const n = state.notifications.find((x) => x.id === btn.dataset.id);
    if (n) { n.unread = false; navigate(n.screen, n.key ? { key: n.key, val: n.val } : {}); }
  } else if (act === 'mark-all-read') { state.notifications.forEach((n) => { n.unread = false; }); renderAll(); showToast('All notifications marked read'); }
  else if (act === 'set-ui-state') { state.uiStateDemo = btn.dataset.val; renderAll(); }
});

renderAll();
</script>
</body>
</html>

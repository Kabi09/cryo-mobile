    :root {
      --navy: #1E3A8A;
      --royal: #1D4ED8;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
    }
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #EEF2F6; color: var(--text); overflow-x: hidden; }
    .phone-shell {
      width: 390px;
      max-width: 100%;
      height: 820px;
      max-height: calc(100vh - 76px);
      background: var(--bg);
      border-radius: 36px;
      border: 8px solid #0F172A;
      box-shadow: 0 24px 60px -15px rgba(15, 23, 42, 0.28);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    @media (max-width: 520px) {
      .phone-shell {
        width: 100%;
        height: calc(100vh - 56px);
        max-height: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }
    .phone-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #CBD5E1 transparent;
    }
    .phone-scroll::-webkit-scrollbar { width: 4px; }
    .phone-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sidebar-scroll {
      scrollbar-width: thin;
      scrollbar-color: #CBD5E1 transparent;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: flex-end;
      z-index: 40;
      animation: fadeIn 0.16s ease-out;
    }
    .sheet-panel {
      width: 100%;
      max-height: 88%;
      background: #FFFFFF;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0.9; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulseBg { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .skeleton { animation: pulseBg 1.4s ease-in-out infinite; background: #E2E8F0; border-radius: 6px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .toast-bar {
      position: absolute;
      top: 46px;
      left: 14px;
      right: 14px;
      z-index: 60;
      animation: fadeIn 0.16s ease-out;
    }
    .gallery-mini-phone {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 360px;
      background: #F8FAFC;
      border: 3px solid #1E293B;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .gallery-mini-phone:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(30, 58, 138, 0.2);
      border-color: #1D4ED8;
    }
  </style>
</head>

function calcDocTotals(items, discount = 0, taxPct = 18) {
  const subtotal = (items || []).reduce((acc, it) => acc + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);
  const disc = Math.min(Number(discount) || 0, subtotal);
  const taxable = Math.max(0, subtotal - disc);
  const tax = Math.round(taxable * (Number(taxPct) || 0) / 100);
  return { subtotal, discount: disc, taxable, tax, grandTotal: taxable + tax };
}

function summarizeEnquiryProducts(items) {
  if (!items || !items.length) return { label: 'No products', totalQty: 0 };
  const first = getProduct(items[0].productId);
  const extra = items.length > 1 ? ` +${items.length - 1} more` : '';
  const totalQty = items.reduce((a, b) => a + (Number(b.qty) || 0), 0);
  return { label: `${first.name}${extra}`, totalQty };
}

let toastTimer = null;
function showToast(message, type = 'success') {
  const el = document.getElementById('phoneToast');
  if (!el) return;
  const styles = type === 'error'
    ? 'bg-rose-600 text-white'
    : type === 'warning'
      ? 'bg-amber-600 text-white'
      : 'bg-[#1E3A8A] text-white';
  el.className = `toast-bar rounded-xl px-3.5 py-2.5 text-xs font-medium shadow-lg flex items-center gap-2 ${styles}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(message)}</span>`;
  el.classList.remove('hidden');
  lucide.createIcons({ nodes: [el] });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

function navigate(screenId, opts = {}) {
  if (opts.selectedKey && opts.selectedId) {
    state.selected[opts.selectedKey] = opts.selectedId;
  }
  if (!opts.skipHistory && state.screen !== screenId) {
    state.history.push(state.screen);
    if (state.history.length > 25) state.history.shift();
  }
  state.activeSheet = null;
  state.screen = screenId;

  // Prepare fresh drafts when entering Create/Edit screens
  if (screenId === 'create-enquiry') {
    state.enquiryDraft = {
      mode: 'create',
      customerId: opts.customerId || '',
      items: [{ productId: opts.productId || '', qty: 1, req: '' }],
      nextFollowup: '',
      notes: ''
    };
  } else if (screenId === 'edit-enquiry') {
    const enq = getEnquiry(state.selected.enquiryId);
    state.enquiryDraft = {
      mode: 'edit',
      id: enq.id,
      customerId: enq.customerId,
      items: enq.items.map((i) => ({ ...i })),
      nextFollowup: enq.nextFollowup || '',
      notes: enq.notes || ''
    };
  } else if (screenId === 'create-quotation') {
    const enq = getEnquiry(opts.enquiryId || state.selected.enquiryId);
    state.selected.enquiryId = enq.id;
    state.quotationDraft = {
      mode: 'create',
      enquiryId: enq.id,
      customerId: enq.customerId,
      items: enq.items.map((it) => {
        const p = getProduct(it.productId);
        return { productId: it.productId, qty: it.qty, unitPrice: p.price, req: it.req || '' };
      }),
      discount: 0,
      taxPct: 18,
      validUntil: '2026-12-20',
      paymentTerms: '50% Advance with PO, 50% prior to dispatch',
      deliveryTimeline: '3 Weeks from PO',
      notes: enq.notes || ''
    };
  } else if (screenId === 'revise-quotation') {
    const q = getQuotation(state.selected.quotationId);
    state.quotationDraft = {
      mode: 'revise',
      quotationId: q.id,
      enquiryId: q.enquiryId,
      customerId: q.customerId,
      prevVersion: q.version,
      prevTotal: calcDocTotals(q.items, q.discount, q.taxPct).grandTotal,
      items: q.items.map((it) => ({ ...it })),
      discount: q.discount || 0,
      taxPct: q.taxPct || 18,
      validUntil: q.validUntil,
      paymentTerms: q.paymentTerms,
      deliveryTimeline: q.deliveryTimeline,
      notes: q.notes || ''
    };
  } else if (screenId === 'send-quotation') {
    state.activeSheet = { type: 'send-quotation', quotationId: state.selected.quotationId };
  } else if (screenId === 'quotation-acceptance') {
    state.activeSheet = { type: 'quotation-acceptance', quotationId: state.selected.quotationId };
  } else if (screenId === 'quotation-rejection') {
    state.activeSheet = { type: 'quotation-rejection', quotationId: state.selected.quotationId };
  } else if (screenId === 'send-production') {
    state.activeSheet = { type: 'send-production', soId: state.selected.soId };
  }

  state.viewMode = 'phone';
  renderAll();
}

function goBack(fallback = 'dashboard') {
  state.activeSheet = null;
  if (state.history.length > 0) {
    state.screen = state.history.pop();
  } else {
    state.screen = fallback;
  }
  renderAll();
}

    { num: 5, label: 'Order', screen: 'so-list' }
  ];
  return `
    <div class="bg-white border border-slate-200 rounded-xl p-3 space-y-2">
      <div class="flex items-center justify-between">
        ${steps.map((st, idx) => {
          const done = st.num < activeStep;
          const curr = st.num === activeStep;
          return `
            <div class="flex items-center ${idx < steps.length - 1 ? 'flex-1' : ''}">
              <button type="button" data-nav="${st.screen}" class="flex flex-col items-center gap-1 shrink-0 group">
                <span class="w-6 h-6 rounded-full text-[11px] font-bold flex items-center justify-center transition ${
                  done ? 'bg-emerald-600 text-white' : curr ? 'bg-[#1E3A8A] text-white ring-4 ring-blue-100' : 'bg-slate-100 text-slate-400 border border-slate-200'
                }">${done ? '✓' : st.num}</span>
                <span class="text-[10px] ${curr ? 'font-bold text-[#1E3A8A]' : done ? 'font-medium text-emerald-700' : 'text-slate-400'}">${st.label}</span>
              </button>
              ${idx < steps.length - 1 ? `<div class="h-0.5 flex-1 mx-1 -mt-4 ${done ? 'bg-emerald-500' : 'bg-slate-200'}"></div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
      ${nextTip ? `<div class="bg-blue-50/80 border border-blue-100 rounded-lg px-2.5 py-1.5 text-[11px] text-[#1E3A8A] flex items-center gap-1.5"><i data-lucide="compass" class="w-3.5 h-3.5 shrink-0"></i><span><strong>Next step:</strong> ${esc(nextTip)}</span></div>` : ''}
    </div>
  `;
}

      quotationId: state.selected.quotationId,
      enquiryId: enq.id,

      paymentTerms: '50% Advance with PO, 50% prior to dispatch',
      deliveryTimeline: '3 Weeks from PO', notes: ''

  return `

          <div><span class="text-amber-700 block text-[10px]">Previous Total (v${d.prevVersion})</span><strong class="text-slate-900">${fmtINR(d.prevTotal)}</strong></div>

    const filtered = grp.items.filter((it) => !searchVal || `${it.num} ${it.title} ${grp.group}`.toLowerCase().includes(searchVal));
    if (!filtered.length) return '';
    return `
      <div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 mb-1">${esc(grp.group)}</div>
        <div class="space-y-0.5">
          ${filtered.map((it) => {
            const active = state.screen === it.id && state.viewMode === 'phone';
            return `
              <button type="button" data-sidebar-screen="${it.id}" class="w-full px-2.5 py-1.5 rounded-lg text-left text-xs flex items-center justify-between transition ${active ? 'bg-[#1E3A8A] text-white font-semibold' : 'text-slate-700 hover:bg-slate-100'}">
                <span class="truncate"><span class="opacity-60 mr-1.5">${it.num}.</span>${esc(it.title)}</span>
                ${active ? '<span class="w-1.5 h-1.5 rounded-full bg-white shrink-0"></span>' : ''}
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

        <h2 class="text-base font-bold text-slate-900">Complete 44-Screen Mobile Design System</h2>

            <span class="text-xs font-semibold text-slate-900 truncate"><span class="text-[#1D4ED8] mr-1">#${it.num}</span>${esc(it.title)}</span>

function renderAll() {
  // Update toolbar buttons
  ['Phone', 'Gallery', 'Flow'].forEach((m) => {
    const key = m.toLowerCase() === 'flow' ? 'workflow' : m.toLowerCase();
    const btn = document.getElementById(`mode${m}Btn`);
    btn.className = `px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1 ${state.viewMode === key ? 'bg-[#1E3A8A] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`;
  });

  document.getElementById('phoneContainer').classList.toggle('hidden', state.viewMode !== 'phone');
  document.getElementById('galleryContainer').classList.toggle('hidden', state.viewMode !== 'gallery');
  document.getElementById('workflowContainer').classList.toggle('hidden', state.viewMode !== 'workflow');

  renderSidebar();

  if (state.viewMode === 'phone') {
    const root = document.getElementById('screenRoot');
    root.innerHTML = renderScreenMarkup(state.screen);
    lucide.createIcons({ nodes: [root] });
    renderSheet();

    const meta = SCREEN_CATALOG.flatMap((g) => g.items).find((i) => i.id === state.screen);
    const metaEl = document.getElementById('screenFooterMeta');
    if (meta && metaEl) {
      metaEl.innerHTML = `<span class="px-2 py-0.5 rounded bg-white border border-slate-200 font-semibold text-[#1E3A8A]">Screen #${meta.num}</span><span>${esc(meta.title)}</span><span>•</span><span><strong>Sales Management</strong></span>`;
    }
  } else if (state.viewMode === 'gallery') {
    renderGallery();
  } else {
    renderWorkflowMap();
  }
}

/* ==========================================================================
   EVENT DELEGATION & FULL INTERACTIVE WORKFLOW HANDLERS
   ========================================================================== */
function syncEnquiryDraftInputs() {
  if (!state.enquiryDraft) return;
  const custSel = document.getElementById('enqCustomerSelect');
  if (custSel) state.enquiryDraft.customerId = custSel.value;
  const nf = document.getElementById('enqNextFollowup');
  if (nf) state.enquiryDraft.nextFollowup = nf.value;
  const notes = document.getElementById('enqNotes');
  if (notes) state.enquiryDraft.notes = notes.value;
  document.querySelectorAll('[data-enq-item-prod]').forEach((el) => {
    const idx = Number(el.dataset.enqItemProd);
    if (state.enquiryDraft.items[idx]) state.enquiryDraft.items[idx].productId = el.value;
  });
  document.querySelectorAll('[data-enq-item-qty]').forEach((el) => {
    const idx = Number(el.dataset.enqItemQty);
    if (state.enquiryDraft.items[idx]) state.enquiryDraft.items[idx].qty = Math.max(1, Number(el.value) || 1);
  });
  document.querySelectorAll('[data-enq-item-req]').forEach((el) => {
    const idx = Number(el.dataset.enqItemReq);
    if (state.enquiryDraft.items[idx]) state.enquiryDraft.items[idx].req = el.value;
  });
}

function syncQuotationDraftInputs() {
  if (!state.quotationDraft) return;
  document.querySelectorAll('[data-qt-qty]').forEach((el) => {
    const idx = Number(el.dataset.qtQty);
    if (state.quotationDraft.items[idx]) state.quotationDraft.items[idx].qty = Math.max(1, Number(el.value) || 1);
  });
  document.querySelectorAll('[data-qt-price]').forEach((el) => {
    const idx = Number(el.dataset.qtPrice);
    if (state.quotationDraft.items[idx]) state.quotationDraft.items[idx].unitPrice = Math.max(0, Number(el.value) || 0);
  });
  const disc = document.getElementById('qtDiscount');
  if (disc) state.quotationDraft.discount = Math.max(0, Number(disc.value) || 0);
  const vu = document.getElementById('qtValidUntil');
  if (vu) state.quotationDraft.validUntil = vu.value;
  const del = document.getElementById('qtDelivery');
  if (del) state.quotationDraft.deliveryTimeline = del.value;
  const pt = document.getElementById('qtPaymentTerms');
  if (pt) state.quotationDraft.paymentTerms = pt.value;
  const nt = document.getElementById('qtNotes');
  if (nt) state.quotationDraft.notes = nt.value;
}

// Toolbar & Sidebar Controls
document.getElementById('modePhoneBtn').addEventListener('click', () => { state.viewMode = 'phone'; renderAll(); });
document.getElementById('modeGalleryBtn').addEventListener('click', () => { state.viewMode = 'gallery'; renderAll(); });
document.getElementById('modeFlowBtn').addEventListener('click', () => { state.viewMode = 'workflow'; renderAll(); });
document.getElementById('sidebarSearch').addEventListener('input', () => renderSidebar());
document.getElementById('sbModeFlowBtn').addEventListener('click', () => { state.sidebarMode = 'flow'; renderSidebar(); });
document.getElementById('sbModeAllBtn').addEventListener('click', () => { state.sidebarMode = 'all'; renderSidebar(); });

const sidebarEl = document.getElementById('screenSidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
  sidebarEl.classList.toggle('-translate-x-full');
  sidebarOverlay.classList.toggle('hidden');
});
sidebarOverlay.addEventListener('click', () => {
  sidebarEl.classList.add('-translate-x-full');
  sidebarOverlay.classList.add('hidden');
});

// Delegated Input & Change Listeners
document.addEventListener('input', (e) => {
  const f = e.target.dataset.filter;
  if (f) {
    state.filters[f] = e.target.value;
    const pos = e.target.selectionStart;
    renderAll();
    const restored = document.querySelector(`[data-filter="${f}"]`);
    if (restored) { restored.focus(); restored.setSelectionRange(pos, pos); }
    return;
  }
  if (e.target.id === 'qtDiscount' || e.target.dataset.qtQty !== undefined || e.target.dataset.qtPrice !== undefined) {
    syncQuotationDraftInputs();
    renderAll();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'enqCustomerSelect' || e.target.dataset.enqItemProd !== undefined) {
    syncEnquiryDraftInputs();
    renderAll();
  }
});

// Delegated Click Handler
document.addEventListener('click', (e) => {
  // Sidebar Jump
  const sbBtn = e.target.closest('[data-sidebar-screen]');
  if (sbBtn) {
    sidebarEl.classList.add('-translate-x-full');
    sidebarOverlay.classList.add('hidden');
    navigate(sbBtn.dataset.sidebarScreen);
    return;
  }

  // Gallery Category Filter
  const galCat = e.target.closest('[data-gallery-cat]');
  if (galCat) {
    state.galleryCategory = galCat.dataset.galleryCat;
    renderGallery();
    return;
  }

  // Gallery / Workflow Card Open
  const galOpen = e.target.closest('[data-gallery-open]');
  if (galOpen) {
    navigate(galOpen.dataset.galleryOpen);
    return;
  }

  // Direct Navigation
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    navigate(navBtn.dataset.nav);
    return;
  }

  // Filter Tabs
  const tabBtn = e.target.closest('[data-filter-tab]');
  if (tabBtn) {
    state.filters[tabBtn.dataset.filterTab] = tabBtn.dataset.val;
    renderAll();
    return;
  }

  // Actions
  const actBtn = e.target.closest('[data-action]');
  if (!actBtn) return;
  const act = actBtn.dataset.action;

  if (act === 'go-back') {
    goBack(actBtn.dataset.fallback || 'dashboard');
  } else if (act === 'close-sheet') {
    state.activeSheet = null;
    renderSheet();
  } else if (act === 'open-sheet') {
    state.activeSheet = { type: actBtn.dataset.sheet };
    renderSheet();
  } else if (act === 'dash-enq') {
    state.filters.enquiryTab = 'New';
    navigate('enquiry-list');
  } else if (act === 'call') {
    showToast(`Calling ${actBtn.dataset.name} (${actBtn.dataset.phone})...`);
  } else if (act === 'download-pdf') {
    showToast(`Downloaded ${actBtn.dataset.doc}`);
  } else if (act === 'open-record') {
    navigate(actBtn.dataset.screen, { selectedKey: actBtn.dataset.key, selectedId: actBtn.dataset.id });
  } else if (act === 'open-fu-ref') {
    if (actBtn.dataset.type === 'Enquiry') navigate('enquiry-details', { selectedKey: 'enquiryId', selectedId: actBtn.dataset.ref });
    else navigate('quotation-details', { selectedKey: 'quotationId', selectedId: actBtn.dataset.ref });
  } else if (act === 'add-fu-for') {
    if (actBtn.dataset.type === 'Enquiry') state.selected.enquiryId = actBtn.dataset.ref;
    else state.selected.quotationId = actBtn.dataset.ref;
    navigate('add-followup');
  } else if (act === 'create-enq-for-cust') {
    navigate('create-enquiry', { customerId: actBtn.dataset.id });
  } else if (act === 'create-enq-for-prod') {
    navigate('create-enquiry', { productId: actBtn.dataset.id });
  } else if (act === 'open-inline-add-cust') {
    syncEnquiryDraftInputs();
    state.activeSheet = { type: 'inline-add-cust' };
    renderSheet();
  } else if (act === 'open-inline-add-prod') {
    syncEnquiryDraftInputs();
    state.activeSheet = { type: 'inline-add-prod' };
    renderSheet();
  } else if (act === 'enq-add-item') {
    syncEnquiryDraftInputs();
    state.enquiryDraft.items.push({ productId: '', qty: 1, req: '' });
    renderAll();
  } else if (act === 'enq-remove-item') {
    syncEnquiryDraftInputs();
    state.enquiryDraft.items.splice(Number(actBtn.dataset.idx), 1);
    renderAll();
  } else if (act === 'sheet-save-cust') {
    const name = (document.getElementById('shCustName')?.value || '').trim();
    const phone = (document.getElementById('shCustPhone')?.value || '').trim();
    if (!name || !phone) { showToast('Customer name & phone are required', 'error'); return; }
    const dup = state.customers.find((c) => c.phone.replace(/\D/g, '') === phone.replace(/\D/g, ''));
    if (dup) { showToast('Customer with this phone already exists!', 'error'); return; }
    const newCust = {
      id: `CUST-00${state.customers.length + 1}`,
      name,
      company: (document.getElementById('shCustCompany')?.value || '').trim(),
      phone,
      email: (document.getElementById('shCustEmail')?.value || '').trim(),
      address: (document.getElementById('shCustAddress')?.value || '').trim(),
      gstin: '', billingAddress: '', shippingAddress: ''
    };
    state.customers.unshift(newCust);
    if (state.enquiryDraft) state.enquiryDraft.customerId = newCust.id;
    state.activeSheet = null;
    renderAll();
    showToast(`${newCust.name} added to Customer Master & selected`);
  } else if (act === 'sheet-save-prod') {
    const name = (document.getElementById('shProdName')?.value || '').trim();
    if (!name) { showToast('Product name is required', 'error'); return; }
    const code = `CRYO-${100 + state.products.length + 1}`;
    const newProd = {
      id: `PRD-100${state.products.length + 1}`,
      code, name,
      model: (document.getElementById('shProdModel')?.value || '').trim() || 'Standard',
      category: 'Scientific Instruments',
      price: Number(document.getElementById('shProdPrice')?.value) || 0,
      specs: '', active: true, icon: 'flask-conical'
    };
    state.products.unshift(newProd);
    if (state.enquiryDraft) {
      const emptySlot = state.enquiryDraft.items.find((i) => !i.productId);
      if (emptySlot) emptySlot.productId = newProd.id;
      else state.enquiryDraft.items.push({ productId: newProd.id, qty: 1, req: '' });
    }
    state.activeSheet = null;
    renderAll();
    showToast(`${newProd.name} (${code}) added to Product Master`);
  } else if (act === 'save-enquiry') {
    syncEnquiryDraftInputs();
    const d = state.enquiryDraft;
    if (!d.customerId) { showToast('Please select or add a customer', 'error'); return; }
    const validItems = d.items.filter((i) => i.productId);
    if (!validItems.length) { showToast('Select at least one product', 'error'); return; }
    if (actBtn.dataset.mode === 'edit') {
      const enq = getEnquiry(d.id);
      enq.customerId = d.customerId;
      enq.items = validItems;
      enq.nextFollowup = d.nextFollowup;
      enq.notes = d.notes;
      enq.timeline.unshift({ date: `${todayStr()} 10:15`, text: `Enquiry updated by ${currentUser().name}` });
      state.selected.enquiryId = enq.id;
      navigate('enquiry-details');
      showToast(`${enq.id} updated successfully`);
    } else {
      const newId = `ENQ-2026-0${46 + state.enquiries.length}`;
      const newEnq = {
        id: newId, customerId: d.customerId, date: todayStr(), qualifiedDate: '',
        status: 'New', nextFollowup: d.nextFollowup, notes: d.notes, lostReason: '',
        items: validItems,
        timeline: [{ date: `${todayStr()} 10:05`, text: `Enquiry created by ${currentUser().name}` }]
      };
      state.enquiries.unshift(newEnq);
      state.selected.enquiryId = newId;
      navigate('enquiry-details');
      showToast(`${newId} created successfully`);
    }
  } else if (act === 'mark-qualified') {
    const enq = getEnquiry(actBtn.dataset.id);
    enq.status = 'Qualified';
    enq.qualifiedDate = todayStr();
    enq.timeline.unshift({ date: `${todayStr()} 10:10`, text: `Marked Qualified by ${currentUser().name}` });
    renderAll();
    showToast(`${enq.id} marked Qualified — Ready for Quotation`);
  } else if (act === 'open-mark-lost') {
    state.activeSheet = { type: 'mark-lost', enquiryId: actBtn.dataset.id };
    renderSheet();
  } else if (act === 'confirm-mark-lost') {
    const enq = getEnquiry(actBtn.dataset.id);
    enq.status = 'Lost';
    enq.lostReason = document.getElementById('shLostReason')?.value || 'Closed';
    enq.timeline.unshift({ date: `${todayStr()} 10:12`, text: `Marked Lost — ${enq.lostReason}` });
    state.activeSheet = null;
    renderAll();
    showToast(`${enq.id} marked Lost`);
  } else if (act === 'create-quote-from-enq') {
    navigate('create-quotation', { enquiryId: actBtn.dataset.id });
  } else if (act === 'save-followup') {
    const purpose = (document.getElementById('addFuPurpose')?.value || '').trim();
    if (!purpose) { showToast('Please enter follow-up notes/purpose', 'error'); return; }
    const type = document.getElementById('addFuType')?.value || 'Enquiry';
    const refId = type === 'Enquiry' ? state.selected.enquiryId : state.selected.quotationId;
    const custId = type === 'Enquiry' ? getEnquiry(refId).customerId : getQuotation(refId).customerId;
    const fDate = document.getElementById('addFuDate')?.value || todayStr();
    state.followups.unshift({
      id: `FU-0${state.followups.length + 1}`,
      type, refId, customerId: custId,
      productSummary: type === 'Enquiry' ? summarizeEnquiryProducts(getEnquiry(refId).items).label : summarizeEnquiryProducts(getQuotation(refId).items).label,
      purpose, date: fDate, time: document.getElementById('addFuTime')?.value || '11:00 AM',
      status: fDate === todayStr() ? 'Today' : 'Upcoming', notes: ''
    });
    state.filters.followupTab = type;
    state.filters.followupStatus = fDate === todayStr() ? 'Today' : 'Upcoming';
    navigate('followups');
    showToast('Follow-up scheduled');
  } else if (act === 'reschedule-fu') {
    const f = state.followups.find((x) => x.id === actBtn.dataset.id);
    if (f) { f.date = '2026-11-23'; f.status = 'Upcoming'; renderAll(); showToast(`Rescheduled ${f.refId} to 2026-11-23`); }
  } else if (act === 'save-followup-update') {
    const f = state.followups.find((x) => x.id === actBtn.dataset.id);
    const resp = document.getElementById('updFuResponse')?.value;
    const notes = document.getElementById('updFuNotes')?.value || '';
    if (f) {
      f.status = 'Completed';
      f.notes = `${resp}: ${notes}`;
      if (f.type === 'Enquiry') {
        const enq = getEnquiry(f.refId);
        if (resp === 'Interested') { enq.status = 'Qualified'; enq.qualifiedDate = todayStr(); }
        else if (resp === 'Not Interested') { enq.status = 'Lost'; enq.lostReason = notes || 'Not Interested'; }
        else { enq.status = 'Follow-up'; }
      } else {
        const qt = getQuotation(f.refId);
        if (resp === 'Accepted') qt.status = 'Accepted';
        else if (resp === 'Negotiation') qt.status = 'Negotiation';
        else if (resp === 'Rejected') qt.status = 'Rejected';
      }
      navigate('followups');
      showToast(`Follow-up updated & ${f.refId} status synced`);
    }
  } else if (act === 'save-customer') {
    const name = (document.getElementById('custName')?.value || '').trim();
    const phone = (document.getElementById('custPhone')?.value || '').trim();
    if (!name || !phone) { showToast('Name and phone are required', 'error'); return; }
    if (actBtn.dataset.mode === 'edit') {
      const c = getCustomer(state.selected.customerId);
      Object.assign(c, {
        name, phone,
        company: document.getElementById('custCompany')?.value || '',
        email: document.getElementById('custEmail')?.value || '',
        address: document.getElementById('custAddress')?.value || '',
        gstin: document.getElementById('custGstin')?.value || '',
        billingAddress: document.getElementById('custBilling')?.value || '',
        shippingAddress: document.getElementById('custShipping')?.value || ''
      });
      navigate('customer-details');
      showToast('Customer updated');
    } else {
      const newC = {
        id: `CUST-00${state.customers.length + 1}`,
        name, phone,
        company: document.getElementById('custCompany')?.value || '',
        email: document.getElementById('custEmail')?.value || '',
        address: document.getElementById('custAddress')?.value || '',
        gstin: document.getElementById('custGstin')?.value || '',
        billingAddress: document.getElementById('custBilling')?.value || '',
        shippingAddress: document.getElementById('custShipping')?.value || ''
      };
      state.customers.unshift(newC);
      state.selected.customerId = newC.id;
      navigate('customers');
      showToast(`${newC.name} added to Customer Master`);
    }
  } else if (act === 'save-product') {
    const name = (document.getElementById('prodName')?.value || '').trim();
    if (!name) { showToast('Product name is required', 'error'); return; }
    if (actBtn.dataset.mode === 'edit') {
      const p = getProduct(state.selected.productId);
      Object.assign(p, {
        name,
        model: document.getElementById('prodModel')?.value || '',
        price: Number(document.getElementById('prodPrice')?.value) || 0,
        category: document.getElementById('prodCategory')?.value || 'Scientific Instruments',
        specs: document.getElementById('prodSpecs')?.value || ''
      });
      navigate('product-details');
      showToast('Product updated');
    } else {
      const code = `CRYO-${100 + state.products.length + 1}`;
      state.products.unshift({
        id: `PRD-100${state.products.length + 1}`, code, name,
        model: document.getElementById('prodModel')?.value || '',
        price: Number(document.getElementById('prodPrice')?.value) || 0,
        category: document.getElementById('prodCategory')?.value || 'Scientific Instruments',
        specs: document.getElementById('prodSpecs')?.value || '',
        active: true, icon: 'flask-conical'
      });
      navigate('products');
      showToast(`Product ${code} added to Product Master`);
    }
  } else if (act === 'save-quotation') {
    syncQuotationDraftInputs();
    const d = state.quotationDraft;
    const totals = calcDocTotals(d.items, d.discount, d.taxPct);
    const mode = actBtn.dataset.mode;
    if (mode === 'revise' || mode === 'revise-preview') {
      const qt = getQuotation(d.quotationId);
      qt.version += 1;
      qt.items = d.items.map((i) => ({ ...i }));
      qt.discount = d.discount;
      qt.validUntil = d.validUntil;
      qt.paymentTerms = d.paymentTerms;
      qt.deliveryTimeline = d.deliveryTimeline;
      qt.notes = d.notes;
      qt.versions.push({ version: qt.version, date: todayStr(), total: totals.grandTotal, note: 'Revised after customer negotiation' });
      state.selected.quotationId = qt.id;
      navigate(mode === 'revise-preview' ? 'quotation-preview' : 'quotation-details');
      showToast(`${qt.id} revised to v${qt.version}`);
    } else {
      const newId = `QT-2026-0${23 + state.quotations.length}`;
      const newQt = {
        id: newId, enquiryId: d.enquiryId, customerId: d.customerId, version: 1,
        date: todayStr(), sentDate: '', validUntil: d.validUntil, status: 'Draft',
        acceptedDate: '', nextFollowup: '', paymentTerms: d.paymentTerms,
        deliveryTimeline: d.deliveryTimeline, discount: d.discount, taxPct: d.taxPct,
        notes: d.notes, negotiationNotes: '', rejectionReason: '',
        items: d.items.map((i) => ({ ...i })),
        versions: [{ version: 1, date: todayStr(), total: totals.grandTotal, note: 'Initial quotation' }]
      };
      state.quotations.unshift(newQt);
      state.selected.quotationId = newId;
      navigate(mode === 'preview' ? 'quotation-preview' : 'quotation-details');
      showToast(`${newId} saved`);
    }
  } else if (act === 'confirm-send-qt') {
    const qt = getQuotation(actBtn.dataset.id);
    qt.status = 'Sent';
    qt.sentDate = todayStr();
    state.activeSheet = null;
    navigate('quotation-details', { selectedKey: 'quotationId', selectedId: qt.id });
    showToast(`${qt.id} sent! You can now schedule a follow-up.`);
  } else if (act === 'confirm-accept-qt') {
    const qt = getQuotation(actBtn.dataset.id);
    qt.status = 'Accepted';
    qt.acceptedDate = document.getElementById('shAcceptDate')?.value || todayStr();
    qt.nextFollowup = '';
    state.followups.forEach((f) => { if (f.type === 'Quotation' && f.refId === qt.id && f.status !== 'Completed') f.status = 'Completed'; });
    state.activeSheet = null;
    navigate('quotation-details', { selectedKey: 'quotationId', selectedId: qt.id });
    showToast(`${qt.id} accepted! Ready to create Proforma Invoice.`);
  } else if (act === 'confirm-reject-qt') {
    const qt = getQuotation(actBtn.dataset.id);
    qt.status = 'Rejected';
    qt.rejectionReason = `${document.getElementById('shRejectReason')?.value || 'Rejected'} — ${document.getElementById('shRejectRemarks')?.value || ''}`.trim();
    state.followups.forEach((f) => { if (f.type === 'Quotation' && f.refId === qt.id && f.status !== 'Completed') f.status = 'Completed'; });
    state.activeSheet = null;
    navigate('quotation-details', { selectedKey: 'quotationId', selectedId: qt.id });
    showToast(`${qt.id} closed as Rejected`);
  } else if (act === 'save-negotiation') {
    const qt = getQuotation(state.selected.quotationId);
    qt.status = 'Negotiation';
    qt.requestedPrice = Number(document.getElementById('negPrice')?.value) || qt.requestedPrice;
    qt.negotiationNotes = document.getElementById('negNotes')?.value || qt.negotiationNotes;
    qt.nextFollowup = document.getElementById('negFollowup')?.value || '';
    if (actBtn.dataset.revise === '1') navigate('revise-quotation');
    else { navigate('quotation-details'); showToast('Negotiation details saved'); }
  } else if (act === 'create-pi-from-qt') {
    state.selected.quotationId = actBtn.dataset.id;
    navigate('create-pi');
  } else if (act === 'save-pi') {
    const qt = getQuotation(actBtn.dataset.qt);
    const newId = `PI-2026-0${17 + state.proformas.length}`;
    state.proformas.unshift({
      id: newId, quotationId: qt.id, quotationVersion: qt.version, customerId: qt.customerId,
      date: todayStr(), expectedDelivery: document.getElementById('piDelivery')?.value || '2026-12-12',
      status: 'Draft',
      billingAddress: document.getElementById('piBilling')?.value || '',
      shippingAddress: document.getElementById('piShipping')?.value || '',
      paymentTerms: document.getElementById('piTerms')?.value || qt.paymentTerms,
      discount: qt.discount, taxPct: qt.taxPct, items: qt.items.map((i) => ({ ...i }))
    });
    state.selected.piId = newId;
    navigate('pi-details');
    showToast(`${newId} created from ${qt.id}`);
  } else if (act === 'send-pi') {
    const pi = getPI(actBtn.dataset.id);
    if (pi.status === 'Draft') pi.status = 'Sent';
    renderAll();
    showToast(`${pi.id} sent to customer`);
  } else if (act === 'record-po-from-pi') {
    state.selected.piId = actBtn.dataset.id;
    navigate('record-po');
  } else if (act === 'save-po') {
    const poNum = (document.getElementById('poNumber')?.value || '').trim();
    if (!poNum) { showToast('Customer PO number is required', 'error'); return; }
    const pi = getPI(actBtn.dataset.pi);
    const piTotal = calcDocTotals(pi.items, pi.discount, pi.taxPct).grandTotal;
    const amt = Number(document.getElementById('poAmount')?.value) || piTotal;
    const newPO = {
      id: poNum, piId: pi.id, customerId: pi.customerId,
      poDate: document.getElementById('poDate')?.value || todayStr(),
      amount: amt, piAmount: piTotal, attachment: `${poNum}_Signed.pdf`,
      status: amt === piTotal ? 'Verified' : 'Pending Verification',
      remarks: document.getElementById('poRemarks')?.value || ''
    };
    state.customerPOs.unshift(newPO);
    pi.status = 'PO Received';
    state.selected.poId = newPO.id;
    navigate('po-details');
    showToast(amt === piTotal ? `${poNum} recorded & verified` : `${poNum} recorded — discrepancy needs verification`, amt === piTotal ? 'success' : 'warning');
  } else if (act === 'verify-po') {
    const po = getPO(actBtn.dataset.id);
    if (po.amount !== po.piAmount && !currentUser().canApproveDiscrepancy) {
      showToast('Only Sales Manager can verify discrepant POs', 'error');
      return;
    }
    po.status = 'Verified';
    renderAll();
    showToast(`${po.id} verified — Ready for Sales Order`);
  } else if (act === 'create-so-from-po') {
    state.selected.poId = actBtn.dataset.id;
    navigate('create-so');
  } else if (act === 'save-so') {
    const po = getPO(actBtn.dataset.po);
    const pi = getPI(po.piId);
    const newId = `SO-2026-0${12 + state.salesOrders.length}`;
    state.salesOrders.unshift({
      id: newId, customerId: po.customerId, quotationId: pi.quotationId, piId: pi.id, poId: po.id,
      date: todayStr(), expectedDelivery: document.getElementById('soDelivery')?.value || pi.expectedDelivery,
      shippingAddress: document.getElementById('soShipping')?.value || pi.shippingAddress,
      status: actBtn.dataset.status, productionNotes: document.getElementById('soNotes')?.value || '',
      totalAmount: po.amount, items: pi.items.map((i) => ({ ...i }))
    });
    state.selected.soId = newId;
    navigate('so-details');
    showToast(`${newId} saved as ${actBtn.dataset.status}`);
  } else if (act === 'confirm-send-prod') {
    const so = getSO(actBtn.dataset.id);
    so.status = 'Sent to Production';
    so.productionNotes = document.getElementById('shProdInstr')?.value || '';
    state.activeSheet = null;
    navigate('so-details', { selectedKey: 'soId', selectedId: so.id });
    showToast(`${so.id} transferred to Production Department`);
  } else if (act === 'save-payment') {
    const p = getPayment(actBtn.dataset.id);
    const amt = Number(document.getElementById('payAmount')?.value) || 0;
    if (amt <= 0) { showToast('Enter a valid received amount', 'error'); return; }
    p.receivedAmount = Math.min(p.totalAmount, p.receivedAmount + amt);
    p.status = p.receivedAmount >= p.totalAmount ? 'Paid' : 'Partial';
    p.history.unshift({
      id: `RCPT-${902 + p.history.length}`,
      date: document.getElementById('payDate')?.value || todayStr(),
      amount: amt,
      method: document.getElementById('payMethod')?.value || 'Bank Transfer',
      txRef: document.getElementById('payTxRef')?.value || '—',
      remarks: document.getElementById('payRemarks')?.value || ''
    });
    navigate('payment-details');
    showToast(`Payment of ${fmtINR(amt)} recorded`);
  } else if (act === 'open-notif') {
    const n = state.notifications.find((x) => x.id === actBtn.dataset.id);
    if (n) {
      n.unread = false;
      navigate(n.targetScreen, n.targetKey ? { selectedKey: n.targetKey, selectedId: n.targetId } : {});
    }
  } else if (act === 'mark-all-read') {
    state.notifications.forEach((n) => { n.unread = false; });
    renderAll();
    showToast('All notifications marked as read');
  } else if (act === 'set-ui-state') {
    state.uiStateDemo = actBtn.dataset.val;
    renderAll();
  } else if (act === 'ui-state-reset') {
    showToast('Cleared state');
  } else if (act === 'ui-state-retry') {
    showToast('Connection restored — data synced');
  } else if (act === 'ui-state-delete') {
    showToast('Draft quotation deleted');
  } else if (act === 'change-password') {
    showToast('Password reset link sent to ' + currentUser().email);
  } else if (act === 'logout') {
    showToast('Signed out of Cryo ERP Sales workspace');
  }
});

// Initial Render
renderAll();
</script>
</body>
</html>

    .no-scrollbar::-webkit-scrollbar { display: none; }

const availStock = (m) => Math.max(0, (m.physical || 0) - (m.reserved || 0));
function stockStatus(m) {
  const av = availStock(m);
  if (av <= 0) return 'Out of Stock';
  if (av < m.minStock) return 'Low Stock';
  return 'In Stock';
}

    const mat = getMat(it.matId);
    const av = availStock(mat);
    const remaining = Math.max(0, it.requested - it.issued);
    const issuable = Math.min(av, remaining);
    const shortage = Math.max(0, remaining - issuable);
    if (issuable > 0) anyIssuable = true;
    if (shortage > 0) anyShortage = true;
    return { ...it, available: av, remaining, issuable, shortage };
  });
  let verdict = 'Full Stock Available';
  if (!anyIssuable && anyShortage) verdict = 'No Stock Available';
  else if (anyIssuable && anyShortage) verdict = 'Partial Stock Available';
  return { rows, verdict, anyIssuable, anyShortage };
}

function calcPOTotals(items, discount = 0, taxPct = 18) {
  const subtotal = (items || []).reduce((a, i) => a + (Number(i.qty) || 0) * (Number(i.unitPrice) || 0), 0);
  const disc = Math.min(Number(discount) || 0, subtotal);
  const taxable = Math.max(0, subtotal - disc);
  const tax = Math.round(taxable * (Number(taxPct) || 0) / 100);
  return { subtotal, discount: disc, tax, grandTotal: taxable + tax };
}

let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('phoneToast');
  if (!el) return;
  const cls = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : 'bg-[#1E3A8A] text-white';
  el.className = `toast-bar rounded-xl px-3.5 py-2.5 text-xs font-medium shadow-lg flex items-center gap-2 ${cls}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(msg)}</span>`;
  el.classList.remove('hidden');
  lucide.createIcons({ nodes: [el] });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

function navigate(screenId, opts = {}) {
  if (opts.key && opts.val) state.selected[opts.key] = opts.val;
  if (!opts.skipHistory && state.screen !== screenId) {
    state.history.push(state.screen);
    if (state.history.length > 25) state.history.shift();
  }
  state.activeSheet = null;
  state.screen = screenId;

  if (screenId === 'create-po' || screenId === 'edit-po') {
    const po = getPO(state.selected.poId);
    const pr = getPR(state.selected.prId);
    state.poDraft = screenId === 'edit-po'
      ? { mode: 'edit', id: po.id, supplierId: po.supplierId, delivery: po.expectedDelivery, terms: po.paymentTerms, discount: po.discount, taxPct: po.taxPct, notes: po.notes, items: po.items.map((i) => ({ ...i })) }
      : { mode: 'create', prId: pr.id, mrId: pr.mrId, supplierId: 'SUP-01', delivery: '2026-11-22', terms: '30 days credit', discount: 0, taxPct: 18, notes: '', items: pr.items.map((i) => ({ matId: i.matId, name: i.name, unit: i.unit, qty: Math.max(1, i.required - i.received), unitPrice: i.matId === 'MAT-02' ? 3200 : 4800 })) };
  } else if (screenId === 'send-po-sheet') {
    state.activeSheet = { type: 'send-po', poId: state.selected.poId };
  }

  state.viewMode = 'phone';
  renderAll();
}

function goBack(fallback = 'dashboard') {
  state.activeSheet = null;
  state.screen = state.history.length ? state.history.pop() : fallback;
  renderAll();
}

    footer = `<button type="button" data-action="close-sheet" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold">Cancel</button><button type="button" data-action="sheet-save-sup" class="flex-1 py-2.5 rounded-xl bg-[#1E3A8A] text-white text-xs font-semibold">Save & Select Supplier</button>`;
  } else if (s.type === 'send-po') {
    const po = getPO(s.poId || state.selected.poId);
    const sup = getSup(po.supplierId);
    title = 'Send Purchase Order';
    content = `<div class="space-y-3 text-xs"><div class="bg-slate-50 rounded-xl p-3 space-y-1"><div class="font-semibold">${esc(sup.name)}</div><div class="text-slate-500">${esc(sup.email)} • ${esc(po.id)}.pdf</div></div><div class="grid grid-cols-3 gap-1.5 text-center"><span class="border border-[#1D4ED8] bg-blue-50 text-[#1E3A8A] rounded-lg py-2 font-medium">Email</span><span class="border border-slate-200 rounded-lg py-2">WhatsApp</span><span class="border border-slate-200 rounded-lg py-2">Mark Sent</span></div></div>`;
    footer = `<button type="button" data-action="close-sheet" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold">Cancel</button><button type="button" data-action="confirm-send-po" data-id="${po.id}" class="flex-1 py-2.5 rounded-xl bg-[#1E3A8A] text-white text-xs font-semibold">Send Purchase Order</button>`;
  }
  root.className = 'sheet-backdrop';
  root.innerHTML = `<div class="sheet-panel"><div class="px-4 py-3 border-b border-slate-200 flex justify-between items-center"><h2 class="text-sm font-semibold">${esc(title)}</h2><button type="button" data-action="close-sheet" class="p-1 text-slate-400"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="p-4 overflow-y-auto">${content}</div><div class="px-4 py-3 border-t border-slate-200 flex gap-2 bg-white">${footer}</div></div>`;
  lucide.createIcons({ nodes: [root] });
}

    'edit-material': () => renderMaterialForm(true), 'material-approval': renderMaterialApproval, 'inventory': renderInventory,
    'inventory-details': renderInventoryDetails, 'stock-history': renderStockHistory, 'stock-adjustment': renderStockAdjustment,
    'suppliers-list': renderSuppliersList, 'add-supplier': () => renderSupplierForm(false), 'supplier-details': renderSupplierDetails,
    'edit-supplier': () => renderSupplierForm(true), 'pr-list': renderPRList, 'create-pr': renderCreatePR, 'pr-details': renderPRDetails,
    'po-list': renderPOList, 'create-po': () => renderPOForm(false), 'po-preview': renderPOPreview, 'send-po-sheet': renderPOPreview,
    'po-details': renderPODetails, 'edit-po': () => renderPOForm(true), 'grn-list': renderGRNList, 'create-grn': renderCreateGRN,
    'confirm-grn': renderConfirmGRN, 'grn-details': renderGRNDetails, 'mi-list': renderMIList, 'create-mi': renderCreateMI,

      ['★', 'Supply Chain Dashboard', 'Pending MRs, low stock & quick actions', 'dashboard', ['dashboard', 'requests-hub', 'inventory-hub', 'purchase-hub', 'more', 'notifications', 'profile']],
      ['1', 'Material Request (MR-001)', 'Receive PRO-001 Deep Freezer request', 'mr-details', ['mr-list', 'mr-details']],
      ['2', 'Check Stock Availability', 'See Compressor (2), Steel (5), Controller (0)', 'stock-check', ['stock-check', 'pending-shortage']],

      ['5', 'Receive Goods (GRN-001)', 'Confirm GRN & auto-increase inventory', 'confirm-grn', ['grn-list', 'create-grn', 'confirm-grn', 'grn-details']],
      ['6', 'Inventory & Masters', 'Materials, Stock History & Suppliers', 'inventory', ['inventory', 'inventory-details', 'stock-history', 'stock-adjustment', 'materials-list', 'add-material', 'material-details', 'edit-material', 'material-approval', 'suppliers-list', 'add-supplier', 'supplier-details', 'edit-supplier']]

    }).join('')}</div><div class="px-1 pt-2 border-t border-slate-200"><button type="button" data-sidebar-screen="ui-states" class="w-full px-2.5 py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left">Common UI States (17)</button></div>`;

  }

  const sv = (document.getElementById('sidebarSearch')?.value || '').trim().toLowerCase();
  container.innerHTML = SCREEN_CATALOG.map((grp) => {

    if (!items.length) return '';

  }).join('');
}

  lucide.createIcons({ nodes: [c] });
}

function renderAll() {
  ['Phone', 'Gallery', 'Flow'].forEach((m) => {
    const key = m.toLowerCase() === 'flow' ? 'workflow' : m.toLowerCase();
    document.getElementById(`mode${m}Btn`).className = `px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1 ${state.viewMode === key ? 'bg-[#1E3A8A] text-white shadow-sm' : 'text-slate-600'}`;
  });
  document.getElementById('phoneContainer').classList.toggle('hidden', state.viewMode !== 'phone');
  document.getElementById('galleryContainer').classList.toggle('hidden', state.viewMode !== 'gallery');
  document.getElementById('workflowContainer').classList.toggle('hidden', state.viewMode !== 'workflow');
  renderSidebar();
  if (state.viewMode === 'phone') {
    const root = document.getElementById('screenRoot');
    root.innerHTML = renderScreenMarkup(state.screen);
    lucide.createIcons({ nodes: [root] });
    renderSheet();
    const meta = SCREEN_CATALOG.flatMap((g) => g.items).find((i) => i.id === state.screen);
    const metaEl = document.getElementById('screenFooterMeta');
    if (meta && metaEl) metaEl.innerHTML = `<span class="px-2 py-0.5 rounded bg-white border border-slate-200 font-semibold text-[#1E3A8A]">Screen #${meta.num}</span><span>${esc(meta.title)}</span><span>•</span><span><strong>${esc(currentUser().role)}</strong></span>`;
  } else if (state.viewMode === 'gallery') renderGallery();
  else renderWorkflowMap();
}

/* ---------- EVENTS ---------- */
document.getElementById('roleSelect').addEventListener('change', (e) => { state.role = e.target.value; renderAll(); showToast(`Role: ${currentUser().role}`); });
document.getElementById('modePhoneBtn').addEventListener('click', () => { state.viewMode = 'phone'; renderAll(); });
document.getElementById('modeGalleryBtn').addEventListener('click', () => { state.viewMode = 'gallery'; renderAll(); });
document.getElementById('modeFlowBtn').addEventListener('click', () => { state.viewMode = 'workflow'; renderAll(); });
document.getElementById('sbModeFlowBtn').addEventListener('click', () => { state.sidebarMode = 'flow'; renderSidebar(); });
document.getElementById('sbModeAllBtn').addEventListener('click', () => { state.sidebarMode = 'all'; renderSidebar(); });
document.getElementById('sidebarSearch').addEventListener('input', () => renderSidebar());

const sidebarEl = document.getElementById('screenSidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('toggleSidebarBtn').addEventListener('click', () => { sidebarEl.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });

document.addEventListener('input', (e) => {
  const f = e.target.dataset.filter;
  if (f) { state.filters[f] = e.target.value; const p = e.target.selectionStart; renderAll(); const el = document.querySelector(`[data-filter="${f}"]`); if (el) { el.focus(); el.setSelectionRange(p, p); } return; }
  if (e.target.dataset.poQty !== undefined && state.poDraft) { state.poDraft.items[Number(e.target.dataset.poQty)].qty = Math.max(1, Number(e.target.value) || 1); renderAll(); }
  if (e.target.dataset.poPrice !== undefined && state.poDraft) { state.poDraft.items[Number(e.target.dataset.poPrice)].unitPrice = Math.max(0, Number(e.target.value) || 0); renderAll(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'poSupSelect' && state.poDraft) { state.poDraft.supplierId = e.target.value; renderAll(); }
});

document.addEventListener('click', (e) => {
  const sb = e.target.closest('[data-sidebar-screen]');
  if (sb) { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); navigate(sb.dataset.sidebarScreen); return; }
  const gc = e.target.closest('[data-gallery-cat]');
  if (gc) { state.galleryCategory = gc.dataset.galleryCat; renderGallery(); return; }
  const go = e.target.closest('[data-gallery-open]');
  if (go) { navigate(go.dataset.galleryOpen); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  const opn = e.target.closest('[data-open]');
  if (opn) { navigate(opn.dataset.open, { key: opn.dataset.key, val: opn.dataset.val }); return; }
  const ft = e.target.closest('[data-filter-tab]');
  if (ft) { state.filters[ft.dataset.filterTab] = ft.dataset.val; renderAll(); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === 'go-back') goBack(btn.dataset.fallback || 'dashboard');
  else if (act === 'close-sheet') { state.activeSheet = null; renderSheet(); }
  else if (act === 'open-sheet') { state.activeSheet = { type: btn.dataset.sheet }; renderSheet(); }
  else if (act === 'call') showToast(`Calling ${btn.dataset.name} (${btn.dataset.phone})...`);
  else if (act === 'download-pdf') showToast(`Downloaded ${btn.dataset.doc}`);
  else if (act === 'save-mat') {
    const name = (document.getElementById('matName')?.value || '').trim();
    if (!name) { showToast('Material name required', 'error'); return; }
    if (btn.dataset.mode === 'edit') {
      Object.assign(getMat(state.selected.matId), { name, unit: document.getElementById('matUnit')?.value, minStock: Number(document.getElementById('matMin')?.value) || 0, category: document.getElementById('matCat')?.value, spec: document.getElementById('matSpec')?.value });
      navigate('material-details'); showToast('Material updated');
    } else {
      const code = `RM-${101 + state.materials.length}`;
      state.materials.unshift({ id: `MAT-0${state.materials.length + 1}`, code, name, unit: document.getElementById('matUnit')?.value || 'Pieces', category: document.getElementById('matCat')?.value || 'General', spec: document.getElementById('matSpec')?.value || '', physical: 0, reserved: 0, minStock: Number(document.getElementById('matMin')?.value) || 0, supplierId: 'SUP-01', active: true });
      navigate('materials-list'); showToast(`${name} (${code}) added to Material Master`);
    }
  } else if (act === 'approve-nma') {
    const idx = state.pendingMaterialApprovals.findIndex((a) => a.id === btn.dataset.id);
    if (idx >= 0) {
      const a = state.pendingMaterialApprovals.splice(idx, 1)[0];
      state.materials.unshift({ id: `MAT-0${state.materials.length + 1}`, code: `RM-${101 + state.materials.length}`, name: a.name, unit: a.unit, category: 'Cryo Parts', spec: a.spec, physical: 0, reserved: 0, minStock: 5, supplierId: 'SUP-01', active: true });
      renderAll(); showToast(`${a.name} approved & added to Material Master`);
    }
  } else if (act === 'reject-nma') {
    state.pendingMaterialApprovals = state.pendingMaterialApprovals.filter((a) => a.id !== btn.dataset.id);
    renderAll(); showToast('Material request rejected');
  } else if (act === 'confirm-adj') {
    const mat = getMat(document.getElementById('adjMat')?.value);
    const dir = document.getElementById('adjType')?.value;
    const qty = Number(document.getElementById('adjQty')?.value) || 0;
    const reason = (document.getElementById('adjReason')?.value || '').trim();
    if (!reason || qty <= 0) { showToast('Enter valid quantity & reason', 'error'); return; }
    if (dir === 'out' && mat.physical < qty) { showToast('Negative inventory is not allowed', 'error'); return; }
    mat.physical += dir === 'in' ? qty : -qty;
    state.stockHistory.unshift({ id: `TX-${105 + state.stockHistory.length}`, matId: mat.id, name: mat.name, ref: 'ADJ', date: todayStr(), qty, balance: mat.physical, type: 'Adjustment', dir });
    navigate('inventory-details', { key: 'matId', val: mat.id }); showToast('Stock adjusted');
  } else if (act === 'save-sup' || act === 'sheet-save-sup') {
    const isSheet = act === 'sheet-save-sup';
    const name = (document.getElementById(isSheet ? 'shSupName' : 'supName')?.value || '').trim();
    const phone = (document.getElementById(isSheet ? 'shSupPhone' : 'supPhone')?.value || '').trim();
    if (!name || !phone) { showToast('Supplier name & phone required', 'error'); return; }
    if (!isSheet && btn.dataset.mode === 'edit') {
      Object.assign(getSup(state.selected.supId), { name, phone, contact: document.getElementById('supContact')?.value || '', email: document.getElementById('supEmail')?.value || '', gstin: document.getElementById('supGstin')?.value || '', address: document.getElementById('supAddress')?.value || '' });
      navigate('supplier-details'); showToast('Supplier updated');
    } else {
      const newS = { id: `SUP-0${state.suppliers.length + 1}`, name, phone, contact: document.getElementById(isSheet ? 'shSupContact' : 'supContact')?.value || '', email: document.getElementById('supEmail')?.value || '', gstin: document.getElementById('supGstin')?.value || '', address: document.getElementById('supAddress')?.value || '', materials: [] };
      state.suppliers.unshift(newS);
      if (isSheet && state.poDraft) { state.poDraft.supplierId = newS.id; state.activeSheet = null; renderAll(); showToast(`${name} added & selected`); }
      else { navigate('suppliers-list'); showToast(`${name} added to Supplier Master`); }
    }
  } else if (act === 'save-pr') {
    const newId = `PR-00${state.purchaseReqs.length + 1}`;
    const mr = getMR(state.selected.mrId);
    const shortItems = calcStockCheck(mr).rows.filter((r) => r.shortage > 0);
    state.purchaseReqs.unshift({ id: newId, mrId: mr.id, proId: mr.proId, requiredDate: document.getElementById('prReqDate')?.value || todayStr(), status: 'Pending', notes: document.getElementById('prNotes')?.value || '', items: (shortItems.length ? shortItems : [{ matId: 'MAT-02', name: 'Steel Sheet', unit: 'Sheets', shortage: 3 }]).map((s) => ({ matId: s.matId, name: s.name, unit: s.unit, required: s.shortage, ordered: 0, received: 0 })) });
    navigate('pr-details', { key: 'prId', val: newId }); showToast(`${newId} created`);
  } else if (act === 'save-po') {
    const d = state.poDraft;
    if (d.mode === 'edit') {
      const po = getPO(d.id); po.supplierId = d.supplierId; po.items = d.items.map((i) => ({ ...i, received: i.received || 0 }));
      navigate(btn.dataset.mode === 'preview' ? 'po-preview' : 'po-details'); showToast(`${po.id} updated`);
    } else {
      const newId = `PO-00${state.purchaseOrders.length + 1}`;
      state.purchaseOrders.unshift({ id: newId, prId: d.prId, mrId: d.mrId, supplierId: d.supplierId, date: todayStr(), expectedDelivery: d.delivery, status: 'Draft', discount: d.discount, taxPct: d.taxPct, paymentTerms: d.terms, notes: d.notes, items: d.items.map((i) => ({ ...i, received: 0 })) });
      state.selected.poId = newId;
      navigate(btn.dataset.mode === 'preview' ? 'po-preview' : 'po-details'); showToast(`${newId} created`);
    }
  } else if (act === 'confirm-send-po') {
    const po = getPO(btn.dataset.id); po.status = 'Sent'; state.activeSheet = null;
    navigate('po-details', { key: 'poId', val: po.id }); showToast(`${po.id} sent to supplier`);
  } else if (act === 'review-grn') {
    const po = getPO(btn.dataset.po);
    const items = po.items.map((it, idx) => ({ matId: it.matId, name: it.name, unit: it.unit, ordered: it.qty, received: Number(document.querySelector(`[data-grn-rec="${idx}"]`)?.value) || 0, accepted: Number(document.querySelector(`[data-grn-acc="${idx}"]`)?.value) || 0, rejected: Number(document.querySelector(`[data-grn-rej="${idx}"]`)?.value) || 0 }));
    const newId = `GRN-00${state.grns.length + 1}`;
    state.grns.unshift({ id: newId, poId: po.id, mrId: po.mrId, supplierId: po.supplierId, date: todayStr(), receivedBy: currentUser().name, invoiceRef: document.getElementById('grnInv')?.value || '', status: 'Draft', confirmed: false, remarks: document.getElementById('grnRem')?.value || '', items });
    navigate('confirm-grn', { key: 'grnId', val: newId });
  } else if (act === 'confirm-grn-final') {
    const g = getGRN(btn.dataset.id);
    if (g.confirmed) { showToast('GRN already confirmed', 'warning'); return; }
    g.confirmed = true; g.status = 'Full Receipt';
    g.items.forEach((it) => {
      const m = getMat(it.matId); m.physical += it.accepted;
      state.stockHistory.unshift({ id: `TX-${105 + state.stockHistory.length}`, matId: m.id, name: m.name, ref: g.id, date: todayStr(), qty: it.accepted, balance: m.physical, type: 'GRN', dir: 'in' });
    });
    const po = getPO(g.poId); po.status = 'Fully Received'; po.items.forEach((pi, idx) => { if (g.items[idx]) pi.received += g.items[idx].accepted; });
    navigate('grn-details', { key: 'grnId', val: g.id });
    showToast(`${g.id} confirmed — Inventory updated & MR-001 refreshed!`);
  } else if (act === 'review-mi') {
    const mr = getMR(btn.dataset.mr);
    const items = [];
    document.querySelectorAll('[data-mi-qty]').forEach((el) => {
      const q = Number(el.value) || 0;
      if (q > 0) { const m = getMat(el.dataset.mat); items.push({ matId: m.id, name: m.name, unit: m.unit, issueQty: q }); }
    });
    const totalRem = mr.items.reduce((a, i) => a + Math.max(0, i.requested - i.issued), 0);
    const totalIss = items.reduce((a, i) => a + i.issueQty, 0);
    state.miDraft = { mrId: mr.id, items, isFull: totalIss >= totalRem };
    navigate('confirm-mi');
  } else if (act === 'confirm-mi-final') {
    const mr = getMR(state.selected.mrId);
    const d = state.miDraft || { items: calcStockCheck(mr).rows.filter((r) => r.issuable > 0).map((r) => ({ matId: r.matId, name: r.name, unit: r.unit, issueQty: r.issuable })), isFull: !calcStockCheck(mr).anyShortage };
    const newId = `MI-00${state.materialIssues.length + 1}`;
    d.items.forEach((it) => {
      const m = getMat(it.matId); m.physical = Math.max(0, m.physical - it.issueQty);
      const mrIt = mr.items.find((x) => x.matId === it.matId); if (mrIt) mrIt.issued += it.issueQty;
      state.stockHistory.unshift({ id: `TX-${105 + state.stockHistory.length}`, matId: m.id, name: m.name, ref: newId, date: todayStr(), qty: it.issueQty, balance: m.physical, type: 'Material Issue', dir: 'out' });
    });
    const allDone = mr.items.every((i) => i.issued >= i.requested);
    mr.status = allDone ? 'Fully Issued' : 'Partially Issued';
    state.materialIssues.unshift({ id: newId, mrId: mr.id, proId: mr.proId, product: mr.product, date: todayStr(), issuedBy: currentUser().name, issueType: allDone ? 'Full Issue' : 'Partial Issue', receiptStatus: 'Awaiting Receipt', remarks: '', items: d.items.map((i) => ({ matId: i.matId, name: i.name, unit: i.unit, issued: i.issueQty, received: 0 })) });
    state.miDraft = null;
    navigate('mi-details', { key: 'miId', val: newId });
    showToast(`${newId} issued — Stock deducted & sent to Production!`);
  } else if (act === 'save-return') {
    const m = getMat(document.getElementById('retMat')?.value);
    const qty = Number(document.getElementById('retQty')?.value) || 0;
    const cond = document.getElementById('retCond')?.value;
    if (qty <= 0) { showToast('Enter valid return qty', 'error'); return; }
    if (cond === 'Usable') {
      m.physical += qty;
      state.stockHistory.unshift({ id: `TX-${105 + state.stockHistory.length}`, matId: m.id, name: m.name, ref: 'RET', date: todayStr(), qty, balance: m.physical, type: 'Material Return', dir: 'in' });
    }
    navigate('inventory-details', { key: 'matId', val: m.id });
    showToast(cond === 'Usable' ? `Returned ${qty} ${m.name} to usable stock` : `Recorded ${qty} damaged ${m.name} separately`);
  } else if (act === 'open-notif') {
    const n = state.notifications.find((x) => x.id === btn.dataset.id);
    if (n) { n.unread = false; navigate(n.screen, n.key ? { key: n.key, val: n.val } : {}); }
  } else if (act === 'mark-all-read') { state.notifications.forEach((n) => { n.unread = false; }); renderAll(); showToast('All notifications marked as read'); }
  else if (act === 'set-ui-state') { state.uiStateDemo = btn.dataset.val; renderAll(); }
  else if (act === 'change-password') showToast(`Password reset sent to ${currentUser().email}`);
  else if (act === 'logout') showToast('Signed out of Cryo ERP Supply Chain');
});

renderAll();
</script>
</body>
</html>

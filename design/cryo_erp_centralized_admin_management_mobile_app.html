const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function badgeHTML(status) {
  const map = {
    'In Production': 'bg-blue-50 text-blue-700 border-blue-200',
    'Ready for Delivery': 'bg-teal-50 text-teal-700 border-teal-200',
    'Delivered': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Waiting for Materials': 'bg-amber-50 text-amber-700 border-amber-200',
    'On Hold': 'bg-rose-50 text-rose-700 border-rose-200',
    'Cancelled': 'bg-rose-50 text-rose-700 border-rose-200',
    'Partially Paid': 'bg-amber-50 text-amber-700 border-amber-200',
    'Paid': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Pending': 'bg-amber-50 text-amber-700 border-amber-200',
    'Approved': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Rejected': 'bg-rose-50 text-rose-700 border-rose-200',
    'High': 'bg-rose-50 text-rose-700 border-rose-200',
    'Normal': 'bg-slate-100 text-slate-700 border-slate-200'
  };
  return `<span class="inline-flex items-center px-2 py-0.5 text-[11px] font-medium rounded-full border ${map[status] || 'bg-slate-100 text-slate-700 border-slate-200'} whitespace-nowrap">${esc(status)}</span>`;
}

let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('phoneToast');
  if (!el) return;
  const cls = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : 'bg-[#1E3A8A] text-white';
  el.className = `toast-bar rounded-xl px-3.5 py-2.5 text-xs font-medium shadow-lg flex items-center gap-2 ${cls}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(msg)}</span>`;
  el.classList.remove('hidden');
  lucide.createIcons({ nodes: [el] });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

function navigate(screenId, opts = {}) {
  if (opts.key && opts.val) state.selected[opts.key] = opts.val;
  if (!opts.skipHistory && state.screen !== screenId) {
    state.history.push(state.screen);
    if (state.history.length > 25) state.history.shift();
  }
  state.screen = screenId;
  state.viewMode = 'phone';
  renderAll();
}

function goBack(fallback = 'dashboard') {
  state.screen = state.history.length ? state.history.pop() : fallback;
  renderAll();
}

      ['6', 'Docs, Logs & Settings', 'Document Centre, Audit & Controls', 'company-settings']
    ];
    c.innerHTML = `<div class="px-1.5 pt-1 pb-2"><div class="text-xs font-semibold text-slate-900">Admin Quick Guide</div><div class="text-[11px] text-slate-500 mt-0.5">Manage the entire company from one app.</div></div><div class="space-y-1.5 px-1">${steps.map(([n, t, d, sc]) => `<button type="button" data-sidebar-screen="${sc}" class="w-full p-2.5 rounded-xl text-left border transition flex items-start gap-2.5 ${state.screen === sc && state.viewMode === 'phone' ? 'bg-[#1E3A8A] text-white border-[#1E3A8A]' : 'bg-white text-slate-800 border-slate-200 hover:border-[#1D4ED8]'}"><span class="w-6 h-6 rounded-full text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5 ${state.screen === sc && state.viewMode === 'phone' ? 'bg-white text-[#1E3A8A]' : 'bg-blue-50 text-[#1E3A8A]'}">${n}</span><div><div class="text-xs font-semibold leading-tight">${t}</div><div class="text-[11px] mt-0.5 ${state.screen === sc && state.viewMode === 'phone' ? 'text-blue-100' : 'text-slate-500'}">${d}</div></div></button>`).join('')}</div><div class="px-1 pt-2 border-t border-slate-200"><button type="button" data-sidebar-screen="ui-states" class="w-full px-2.5 py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-medium text-slate-700 text-left">Common UI States (15)</button></div>`;
    return;
  }

  const sv = (document.getElementById('sidebarSearch')?.value || '').trim().toLowerCase();
  c.innerHTML = SCREEN_CATALOG.map((grp) => {
    const items = grp.items.filter((i) => !sv || `${i.num} ${i.title} ${grp.group}`.toLowerCase().includes(sv));
    if (!items.length) return '';
    return `<div><div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 mb-1">${esc(grp.group)}</div><div class="space-y-0.5">${items.map((it) => `<button type="button" data-sidebar-screen="${it.id}" class="w-full px-2.5 py-1.5 rounded-lg text-left text-xs ${state.screen === it.id && state.viewMode === 'phone' ? 'bg-[#1E3A8A] text-white font-semibold' : 'text-slate-700 hover:bg-slate-100'}"><span class="opacity-60 mr-1.5">${it.num}.</span>${esc(it.title)}</button>`).join('')}</div></div>`;
  }).join('');
}

function renderGallery() {
  const c = document.getElementById('galleryContainer');
  const all = SCREEN_CATALOG.flatMap((g) => g.items.map((i) => ({ ...i, group: g.group })));
  const groups = ['All', ...SCREEN_CATALOG.map((g) => g.group)];
  const shown = state.galleryCategory === 'All' ? all : all.filter((i) => i.group === state.galleryCategory);
  c.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-4 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-base font-bold">All 47 Centralized Admin Screens</h2><p class="text-xs text-slate-500">Click any screen card to open it in the live mobile app.</p></div><div class="flex gap-1.5 overflow-x-auto no-scrollbar">${groups.map((g) => `<button type="button" data-gallery-cat="${esc(g)}" class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border ${state.galleryCategory === g ? 'bg-[#1E3A8A] text-white border-[#1E3A8A]' : 'bg-white text-slate-600 border-slate-200'}">${esc(g)}</button>`).join('')}</div></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${shown.map((it) => `<div data-gallery-open="${it.id}" class="bg-white border border-slate-200 rounded-2xl p-3 cursor-pointer hover:border-[#1D4ED8] hover:shadow-md transition flex flex-col"><div class="text-xs font-semibold mb-2 truncate"><span class="text-[#1D4ED8] mr-1">#${it.num}</span>${esc(it.title)}</div><div class="gallery-mini-phone pointer-events-none select-none"><div class="origin-top-left w-[360px] h-[640px] scale-[0.65] flex flex-col bg-[#F8FAFC]">${renderScreenMarkup(it.id)}</div></div></div>`).join('')}</div>`;
  lucide.createIcons({ nodes: [c] });
}

function renderWorkflowMap() {
  const c = document.getElementById('workflowContainer');
  const modules = [
    ['Sales', 'ENQ-001 → QT-001 → PI-001 → CPO-001 → SO-001', 'ws-sales'],
    ['Production', 'PRO-001 → BOM-001 → Daily Build → Quality Check', 'ws-production'],
    ['Supply Chain', 'MR-001 → Stock Check → PO-001 → GRN-001 → MI-001/002', 'ws-supply-chain'],
    ['Logistics', 'DEL-001 → Packing → DC-001 → Dispatch → POD', 'ws-logistics'],
    ['Employees', 'Single Login → Multi-Dept Access → Permissions & Audit', 'ws-employees'],
    ['Central Admin', '22-Stage Order Journey, Approvals, Finance & 7 Reports', 'order-journey']
  ];
  c.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-4"><div><h2 class="text-base font-bold">Cryo Enterprise ERP – Unified Architecture (One Source of Truth)</h2><p class="text-xs text-slate-500">Same linked record (SO-001 • ABC Laboratory • Deep Freezer × 2 • ₹1,50,000) across every department.</p></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3">${modules.map(([t, d, sc]) => `<button type="button" data-gallery-open="${sc}" class="text-left bg-slate-50 hover:bg-blue-50/60 border border-slate-200 hover:border-[#1D4ED8] rounded-xl p-4 space-y-1.5"><div class="text-sm font-bold text-[#1E3A8A]">${t}</div><div class="text-xs text-slate-600">${d}</div></button>`).join('')}</div></div>`;
}

function renderAll() {
  ['Phone', 'Gallery', 'Flow'].forEach((m) => {
    const key = m.toLowerCase() === 'flow' ? 'workflow' : m.toLowerCase();
    document.getElementById(`mode${m}Btn`).className = `px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1 ${state.viewMode === key ? 'bg-[#1E3A8A] text-white shadow-sm' : 'text-slate-600'}`;
  });
  document.getElementById('phoneContainer').classList.toggle('hidden', state.viewMode !== 'phone');
  document.getElementById('galleryContainer').classList.toggle('hidden', state.viewMode !== 'gallery');
  document.getElementById('workflowContainer').classList.toggle('hidden', state.viewMode !== 'workflow');
  renderSidebar();
  if (state.viewMode === 'phone') {
    const root = document.getElementById('screenRoot');
    root.innerHTML = renderScreenMarkup(state.screen);
    lucide.createIcons({ nodes: [root] });
    const meta = SCREEN_CATALOG.flatMap((g) => g.items).find((i) => i.id === state.screen);
    const metaEl = document.getElementById('screenFooterMeta');
    if (meta && metaEl) metaEl.innerHTML = `<span class="px-2 py-0.5 rounded bg-white border border-slate-200 font-semibold text-[#1E3A8A]">Screen #${meta.num}</span><span>${esc(meta.title)}</span><span>•</span><span><strong>Centralized Admin</strong></span>`;
  } else if (state.viewMode === 'gallery') renderGallery();
  else renderWorkflowMap();
}

/* ---------- EVENTS ---------- */
document.getElementById('modePhoneBtn').addEventListener('click', () => { state.viewMode = 'phone'; renderAll(); });
document.getElementById('modeGalleryBtn').addEventListener('click', () => { state.viewMode = 'gallery'; renderAll(); });
document.getElementById('modeFlowBtn').addEventListener('click', () => { state.viewMode = 'workflow'; renderAll(); });
document.getElementById('sbModeFlowBtn').addEventListener('click', () => { state.sidebarMode = 'flow'; renderSidebar(); });
document.getElementById('sbModeAllBtn').addEventListener('click', () => { state.sidebarMode = 'all'; renderSidebar(); });
document.getElementById('sidebarSearch').addEventListener('input', () => renderSidebar());

const sidebarEl = document.getElementById('screenSidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('toggleSidebarBtn').addEventListener('click', () => { sidebarEl.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });

document.addEventListener('input', (e) => {
  const f = e.target.dataset.filter;
  if (f) { state.filters[f] = e.target.value; const p = e.target.selectionStart; renderAll(); const el = document.querySelector(`[data-filter="${f}"]`); if (el) { el.focus(); el.setSelectionRange(p, p); } }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.wfToggle) { state.workflowToggles[e.target.dataset.wfToggle] = e.target.checked; }
});

document.addEventListener('click', (e) => {
  const sb = e.target.closest('[data-sidebar-screen]');
  if (sb) { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); navigate(sb.dataset.sidebarScreen); return; }
  const gc = e.target.closest('[data-gallery-cat]');
  if (gc) { state.galleryCategory = gc.dataset.galleryCat; renderGallery(); return; }
  const go = e.target.closest('[data-gallery-open]');
  if (go) { navigate(go.dataset.galleryOpen); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  const opn = e.target.closest('[data-open]');
  if (opn) { navigate(opn.dataset.open, { key: opn.dataset.key, val: opn.dataset.val }); return; }
  const ft = e.target.closest('[data-filter-tab]');
  if (ft) { state.filters[ft.dataset.filterTab] = ft.dataset.val; renderAll(); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === 'go-back') goBack(btn.dataset.fallback || 'dashboard');
  else if (act === 'toast') showToast(btn.dataset.msg);
  else if (act === 'toggle-pwd') { state.showPwd = !state.showPwd; renderAll(); }
  else if (act === 'set-date') { state.dateFilter = btn.dataset.val; renderAll(); }
  else if (act === 'quick-search') { state.filters.globalQuery = btn.dataset.val; renderAll(); }
  else if (act === 'confirm-hc') {
    const o = getOrder(btn.dataset.id);
    const reason = (document.getElementById('hcReason')?.value || '').trim();
    if (!reason) { showToast('Reason is required', 'error'); return; }
    o.stage = document.getElementById('hcAct')?.value || 'On Hold';
    navigate('all-orders'); showToast(`${o.id} updated to ${o.stage}`);
  } else if (act === 'apr-decide') {
    const a = getApproval(btn.dataset.id); a.status = btn.dataset.val;
    state.activityLogs.unshift({ id: `LOG-0${state.activityLogs.length + 1}`, type: a.status, dept: a.dept, ref: a.ref, by: 'Admin', time: 'Just now', desc: `${a.status} ${a.type}`, prev: 'Pending', next: a.status });
    navigate('approvals'); showToast(`${a.ref} ${a.status}`);
  } else if (act === 'save-cust-pay') {
    const o = getOrder(btn.dataset.id); const amt = Number(document.getElementById('rcpAmt')?.value) || 0;
    if (amt <= 0) { showToast('Enter valid amount', 'error'); return; }
    o.received = Math.min(o.orderValue, o.received + amt);
    o.paymentStatus = o.received >= o.orderValue ? 'Paid' : 'Partially Paid';
    navigate('customer-payments'); showToast(`Recorded ${fmtINR(amt)} & synced across Sales, Logistics & Admin`);
  } else if (act === 'save-sup-pay') {
    const s = state.supplierPayables.find((x) => x.poId === btn.dataset.id);
    const amt = Number(document.getElementById('rspAmt')?.value) || 0;
    if (s && amt > 0) { s.paid = Math.min(s.payable, s.paid + amt); s.status = s.paid >= s.payable ? 'Paid' : 'Partially Paid'; }
    navigate('supplier-payments'); showToast(`Recorded supplier payment ${fmtINR(amt)}`);
  } else if (act === 'save-company') {
    Object.assign(state.company, { name: document.getElementById('cName')?.value || state.company.name, email: document.getElementById('cEmail')?.value || state.company.email, phone: document.getElementById('cPhone')?.value || state.company.phone, gstin: document.getElementById('cGstin')?.value || state.company.gstin, address: document.getElementById('cAddr')?.value || state.company.address });
    navigate('company-settings'); showToast('Company profile updated');
  } else if (act === 'open-notif') {
    const n = state.notifications.find((x) => x.id === btn.dataset.id);
    if (n) { n.unread = false; navigate(n.screen); }
  } else if (act === 'mark-all-read') { state.notifications.forEach((n) => { n.unread = false; }); renderAll(); showToast('All notifications marked read'); }
  else if (act === 'set-ui-state') { state.uiStateDemo = btn.dataset.val; renderAll(); }
});

renderAll();
</script>
</body>
</html>

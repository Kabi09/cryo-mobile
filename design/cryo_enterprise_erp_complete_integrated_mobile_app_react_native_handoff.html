<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryo Enterprise ERP – Complete Integrated Mobile App & React Native Handoff</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#1E3A8A; --royal:#1D4ED8; --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0; --text:#0F172A; }
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #EEF2F6; color: var(--text); overflow-x: hidden; }
    .phone-shell {
      width: 390px; max-width: 100%; height: 820px; max-height: calc(100vh - 76px);
      background: var(--bg); border-radius: 36px; border: 8px solid #0F172A;
      box-shadow: 0 24px 60px -15px rgba(15, 23, 42, 0.28);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    @media (max-width: 520px) {
      .phone-shell { width: 100%; height: calc(100vh - 56px); max-height: none; border-radius: 0; border: none; box-shadow: none; }
    }
    .phone-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
    .phone-scroll::-webkit-scrollbar { width: 4px; }
    .phone-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sidebar-scroll { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: flex-end; z-index: 40; animation: fadeIn 0.16s ease-out; }
    .sheet-panel { width: 100%; max-height: 85%; background: #FFF; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0.9; } to { transform: translateY(0); opacity: 1; } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .toast-bar { position: absolute; top: 46px; left: 14px; right: 14px; z-index: 60; animation: fadeIn 0.16s ease-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Integrated Toolbar -->
  <header class="bg-white border-b border-slate-200 px-3 sm:px-4 h-14 flex items-center justify-between gap-2 sticky top-0 z-50">
    <div class="flex items-center gap-2.5 min-w-0">
      <button id="toggleSidebarBtn" type="button" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100" aria-label="Toggle menu">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="w-8 h-8 rounded-lg bg-[#1E3A8A] text-white flex items-center justify-center font-bold text-sm shrink-0">C</div>
      <div class="min-w-0">
        <div class="font-semibold text-sm text-slate-900 truncate">Cryo Enterprise ERP – Integrated Mobile Suite</div>
        <div class="text-[11px] text-slate-500 truncate hidden sm:block">6 Connected Modules • Live Shared Database • React Native Handoff</div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Permission Persona Switcher (Section 9) -->
      <select id="personaSelect" aria-label="Test Permission Persona" class="px-2 py-1 text-xs font-medium bg-blue-50 border border-blue-200 rounded-lg text-[#1E3A8A] focus:outline-none">
        <option value="admin">Admin (All 5 Depts)</option>
        <option value="multi">Arun (Sales + Prod View)</option>
        <option value="single">Murugan (Supply Chain)</option>
        <option value="viewonly">Viewer (Read-Only)</option>
        <option value="nowf">Draft User (No Workflow)</option>
      </select>

      <div class="flex items-center bg-slate-100 rounded-lg p-0.5 border border-slate-200">
        <button id="modePhoneBtn" type="button" class="px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1"><i data-lucide="smartphone" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">App</span></button>
        <button id="modeFlowBtn" type="button" class="px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1"><i data-lucide="git-branch" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Workflow</span></button>
        <button id="modeHandoffBtn" type="button" class="px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1"><i data-lucide="code-2" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Dev Handoff</span></button>
      </div>
    </div>
  </header>

  <div class="flex-1 flex relative overflow-hidden">
    <!-- Left Unified Module & Journey Navigator -->
    <aside id="screenSidebar" class="fixed lg:static inset-y-14 left-0 z-40 w-72 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="p-3 border-b border-slate-200 space-y-2">
        <div class="grid grid-cols-2 bg-slate-100 rounded-lg p-0.5 border border-slate-200">
          <button id="sbModeJourneyBtn" type="button" class="py-1.5 text-xs font-semibold rounded-md transition">E2E Journey</button>
          <button id="sbModeModulesBtn" type="button" class="py-1.5 text-xs font-semibold rounded-md transition">All Modules</button>
        </div>
      </div>
      <div id="sidebarList" class="flex-1 overflow-y-auto sidebar-scroll p-2 space-y-3"></div>
    </aside>
    <div id="sidebarOverlay" class="fixed inset-0 top-14 bg-slate-900/30 z-30 hidden lg:hidden"></div>

    <!-- Main Workspace -->
    <main class="flex-1 overflow-y-auto flex items-start justify-center p-0 sm:p-4 lg:p-5">
      <div id="phoneContainer" class="flex flex-col items-center w-full">
        <div class="phone-shell">
          <div class="h-7 px-5 bg-white flex items-center justify-between text-[11px] font-semibold text-slate-800 shrink-0 select-none border-b border-slate-100">
            <span>13:45</span>
            <div class="w-20 h-4 bg-slate-900 rounded-full hidden sm:block"></div>
            <div class="flex items-center gap-1.5 text-slate-700"><i data-lucide="signal" class="w-3 h-3"></i><i data-lucide="wifi" class="w-3 h-3"></i><i data-lucide="battery-full" class="w-3.5 h-3.5"></i></div>
          </div>
          <div id="phoneToast" class="toast-bar hidden"></div>
          <div id="screenRoot" class="flex-1 flex flex-col min-h-0 relative"></div>
          <div id="sheetRoot" class="hidden"></div>
        </div>
        <div id="screenFooterMeta" class="hidden sm:flex items-center gap-2 mt-2.5 text-xs text-slate-500"></div>
      </div>

      <div id="workflowContainer" class="hidden w-full max-w-5xl mx-auto pb-8"></div>
      <div id="handoffContainer" class="hidden w-full max-w-6xl mx-auto pb-8"></div>
    </main>
  </div>

<script>
/* ==========================================================================
   CRYO ENTERPRISE ERP – COMPLETE INTEGRATED MOBILE APPLICATION
   One Shared Database • 6 Unified Modules • Live Permission Engine • RN Handoff
   ========================================================================== */

const PERSONAS = {
  admin: {
    id: 'EMP-ADM-001', name: 'Priya Nair', email: 'admin@cryoerp.com', label: 'Full Admin Access',
    isAdmin: true, depts: ['sales', 'production', 'supply-chain', 'logistics', 'employees'],
    perms: { sales: { view: true, create: true, edit: true, workflow: true }, production: { view: true, create: true, edit: true, workflow: true }, 'supply-chain': { view: true, create: true, edit: true, workflow: true }, logistics: { view: true, create: true, edit: true, workflow: true }, employees: { view: true, create: true, edit: true, workflow: true } }
  },
  multi: {
    id: 'EMP-001', name: 'Arun Kumar', email: 'arun@example.com', label: 'Sales (Std) + Prod (View Only)',
    isAdmin: false, depts: ['sales', 'production'],
    perms: { sales: { view: true, create: true, edit: true, workflow: true }, production: { view: true, create: false, edit: false, workflow: false } }
  },
  single: {
    id: 'EMP-SC-308', name: 'Murugan S', email: 'murugan@cryoerp.com', label: 'Single Dept (Supply Chain)',
    isAdmin: false, depts: ['supply-chain'],
    perms: { 'supply-chain': { view: true, create: true, edit: true, workflow: true } }
  },
  viewonly: {
    id: 'EMP-VW-009', name: 'Ramesh Viewer', email: 'viewer@cryoerp.com', label: 'View-Only Employee',
    isAdmin: false, depts: ['sales', 'production'],
    perms: { sales: { view: true, create: false, edit: false, workflow: false }, production: { view: true, create: false, edit: false, workflow: false } }
  },
  nowf: {
    id: 'EMP-DR-012', name: 'Kavya Drafts', email: 'kavya@cryoerp.com', label: 'Create/Edit Only (No Workflow)',
    isAdmin: false, depts: ['sales'],
    perms: { sales: { view: true, create: true, edit: true, workflow: false } }
  }
};

const DEPT_META = {
  admin: { name: 'Admin Management', short: 'Admin', icon: 'shield', home: 'admin-dashboard' },
  sales: { name: 'Sales Management', short: 'Sales', icon: 'briefcase', home: 'sales-dashboard' },
  production: { name: 'Production Management', short: 'Production', icon: 'factory', home: 'prod-dashboard' },
  'supply-chain': { name: 'Supply Chain Management', short: 'Supply Chain', icon: 'boxes', home: 'scm-dashboard' },
  logistics: { name: 'Logistics & Delivery', short: 'Logistics', icon: 'truck', home: 'log-dashboard' },
  employees: { name: 'Employee & Permissions', short: 'Employees', icon: 'users', home: 'emp-dashboard' }
};

/* ---------- ONE SHARED LIVE ERP DATABASE (Section 11 Continuity) ---------- */
const db = {
  viewMode: 'phone', // 'phone' | 'workflow' | 'handoff'
  sidebarMode: 'journey',
  personaKey: 'admin',
  activeDept: 'admin',
  screen: 'admin-dashboard',
  history: [],
  activeSheet: null,

  // Master Data (Shared everywhere)
  customers: [
    { id: 'CUST-001', name: 'ABC Laboratory', contact: 'Dr. Ramesh Babu', phone: '+91 98402 55110', email: 'ramesh@abclab.in', address: 'Guindy Industrial Estate, Chennai, Tamil Nadu' },
    { id: 'CUST-002', name: 'Apex Pharma Labs', contact: 'Rajesh Kulkarni', phone: '+91 98201 44512', email: 'rk@apexpharma.in', address: 'Peenya Phase II, Bengaluru' }
  ],
  products: [
    { id: 'PRD-001', code: 'CRYO-DF80', name: 'Deep Freezer (-80°C)', model: 'DF80-340L', price: 75000 },
    { id: 'PRD-002', code: 'CRYO-INC200', name: 'Laboratory Incubator', model: 'INC-200D', price: 95000 },
    { id: 'PRD-003', code: 'CRYO-WB18', name: 'Digital Water Bath', model: 'WB-18SS', price: 28500 }
  ],
  materials: [
    { id: 'MAT-01', code: 'RM-101', name: 'Compressor', unit: 'Pieces', stock: 2, minStock: 2 },
    { id: 'MAT-02', code: 'RM-102', name: 'Steel Sheet', unit: 'Sheets', stock: 5, minStock: 6 },
    { id: 'MAT-03', code: 'RM-103', name: 'Temperature Controller', unit: 'Pieces', stock: 0, minStock: 4 }
  ],
  suppliers: [{ id: 'SUP-01', name: 'ABC Industrial Supplies', phone: '+91 98405 11223' }],
  vehicles: [{ id: 'VEH-01', regNo: 'TN 01 AB 1234', type: 'Mini Truck', status: 'Available' }],
  providers: [{ id: 'PROV-01', name: 'Sample Road Transport', type: 'Road Transport', phone: '+91 98409 22110' }],

  // Live Connected Order Lifecycle (SO-001 — mutates live across ALL 6 departments!)
  order: {
    enqId: 'ENQ-001', enqStatus: 'Qualified',
    qtId: 'QT-001', qtVersion: 2, qtStatus: 'Accepted', qtNegotiated: true,
    piId: 'PI-001', cpoId: 'CPO-001', soId: 'SO-001',
    customer: 'ABC Laboratory', product: 'Deep Freezer (-80°C)', qty: 2,
    orderValue: 150000, receivedAmount: 100000, paymentArrangement: 'Collect balance on delivery',
    proId: 'PRO-001', proStatus: 'Waiting for Materials', bomId: 'BOM-001', bomConfirmed: true,
    mrId: 'MR-001', mrStatus: 'Partially Issued',
    mi1Issued: true, mi2Issued: false,
    poId: 'PO-001', poStatus: 'Confirmed',
    grnId: 'GRN-001', grnConfirmed: false,
    prodProgress: 40, qcStatus: 'Pending',
    delId: 'DEL-001', pkgId: 'PKG-001', dcId: 'DC-001', delMethod: 'Own Vehicle',
    delStatus: 'Not Planned', podRecorded: false,
    completedStageNum: 12 // Advances live up to 22 as user clicks actions!
  },

  approvals: [
    { id: 'APR-01', type: 'Quotation Discount (12%)', ref: 'QT-005', dept: 'Sales', by: 'Arun Kumar', status: 'Pending' },
    { id: 'APR-02', type: 'New Material Master Request', ref: 'NMA-01', dept: 'Supply Chain', by: 'Deepak Raj', status: 'Pending' }
  ],

  logs: [
    { time: '10:15 AM', dept: 'Sales', text: 'QT-001 (v2) accepted after negotiation → SO-001 confirmed' },
    { time: '11:00 AM', dept: 'Production', text: 'PRO-001 created with BOM-001 → MR-001 sent to Supply Chain' },
    { time: '11:45 AM', dept: 'Supply Chain', text: 'MI-001 partial issue (Compressor 2, Steel 5) & PO-001 created' }
  ]
};

/* ---------- PERMISSION ENGINE ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const fmtINR = (n) => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const curUser = () => PERSONAS[db.personaKey];

function canAccessDept(deptKey) {
  if (deptKey === 'admin') return curUser().isAdmin;
  return curUser().depts.includes(deptKey);
}
function canAct(deptKey, action) {
  const u = curUser();
  if (u.isAdmin) return true;
  return !!(u.perms[deptKey] && u.perms[deptKey][action]);
}
function logEvent(dept, text) {
  db.logs.unshift({ time: 'Just now', dept, text });
}

function badgeHTML(status) {
  const map = {
    'Qualified': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Accepted': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Waiting for Materials': 'bg-amber-50 text-amber-700 border-amber-200',
    'Materials Ready': 'bg-teal-50 text-teal-700 border-teal-200',
    'In Production': 'bg-blue-50 text-blue-700 border-blue-200',
    'Quality Check': 'bg-purple-50 text-purple-700 border-purple-200',
    'Completed': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Partially Issued': 'bg-amber-50 text-amber-700 border-amber-200',
    'Fully Issued': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Confirmed': 'bg-blue-50 text-blue-700 border-blue-200',
    'In Transit': 'bg-blue-50 text-blue-700 border-blue-200',
    'Delivered': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Paid': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Partially Paid': 'bg-amber-50 text-amber-700 border-amber-200',
    'Pending': 'bg-amber-50 text-amber-700 border-amber-200',
    'Approved': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Rejected': 'bg-rose-50 text-rose-700 border-rose-200',
    'View Only': 'bg-slate-100 text-slate-600 border-slate-200'
  };
  return `<span class="inline-flex items-center px-2 py-0.5 text-[11px] font-medium rounded-full border ${map[status] || 'bg-slate-100 text-slate-700 border-slate-200'} whitespace-nowrap">${esc(status)}</span>`;
}

let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('phoneToast');
  if (!el) return;
  const cls = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : 'bg-[#1E3A8A] text-white';
  el.className = `toast-bar rounded-xl px-3.5 py-2.5 text-xs font-medium shadow-lg flex items-center gap-2 ${cls}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(msg)}</span>`;
  el.classList.remove('hidden');
  lucide.createIcons({ nodes: [el] });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

function goScreen(screenId, deptOverride = null) {
  const inferredDept = deptOverride || (
    screenId.startsWith('sales-') ? 'sales' :
    screenId.startsWith('prod-') ? 'production' :
    screenId.startsWith('scm-') ? 'supply-chain' :
    screenId.startsWith('log-') ? 'logistics' :
    screenId.startsWith('emp-') ? 'employees' :
    screenId.startsWith('admin-') ? 'admin' : db.activeDept
  );

  // Enforce permission check on department entry (Section 9)
  const isAuthScreen = screenId.startsWith('auth-');
  if (!isAuthScreen && !canAccessDept(inferredDept)) {
    db.screen = 'auth-restricted';
    db.viewMode = 'phone';
    renderAll();
    showToast(`Access restricted for ${curUser().name}`, 'error');
    return;
  }

  if (!isAuthScreen) db.activeDept = inferredDept;
  if (db.screen !== screenId) { db.history.push(db.screen); if (db.history.length > 25) db.history.shift(); }
  db.activeSheet = null;
  db.screen = screenId;
  db.viewMode = 'phone';
  renderAll();
}

function goBack() {
  db.activeSheet = null;
  db.screen = db.history.length ? db.history.pop() : (curUser().isAdmin ? 'admin-dashboard' : DEPT_META[curUser().depts[0]].home);
  renderAll();
}

/* ---------- UNIFIED CHROME (Single Bottom Nav + Admin Return Bar) ---------- */
function renderDeptReturnBar() {
  if (db.activeDept === 'admin') return '';
  const u = curUser();
  return `
    <div class="bg-[#1E3A8A] text-white px-3.5 py-1.5 flex items-center justify-between text-[11px] shrink-0">
      ${u.isAdmin
        ? `<button type="button" data-go="admin-dashboard" class="flex items-center gap-1 font-semibold hover:underline"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>Return to Admin</button>`
        : `<span class="font-medium truncate">${esc(DEPT_META[db.activeDept].name)}</span>`
      }
      ${(u.isAdmin || u.depts.length > 1) ? `<button type="button" data-action="open-dept-switcher" class="px-2 py-0.5 rounded bg-white/15 font-semibold">Switch Dept ▾</button>` : `<span class="opacity-75">${esc(u.name.split(' ')[0])}</span>`}
    </div>`;
}

function renderHeader(title, opts = {}) {
  const back = opts.back ? `<button type="button" data-action="go-back" class="p-1.5 -ml-1.5 rounded-lg text-slate-700 hover:bg-slate-100"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>` : '';
  return `
    ${opts.hideReturnBar ? '' : renderDeptReturnBar()}
    <div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-2 min-w-0">${back}<h1 class="text-[15px] font-semibold text-slate-900 truncate">${esc(title)}</h1></div>
      <div class="flex items-center gap-1.5 shrink-0">${opts.right || ''}</div>
    </div>`;
}

function renderBottomNav(dept, activeKey) {
  const navConfig = {
    admin: [['home', 'Home', 'home', 'admin-dashboard'], ['depts', 'Depts', 'layout-grid', 'admin-depts'], ['orders', 'Orders', 'package', 'admin-journey'], ['reports', 'Reports', 'bar-chart-3', 'admin-reports'], ['more', 'More', 'menu', 'admin-approvals']],
    sales: [['home', 'Home', 'home', 'sales-dashboard'], ['enq', 'Enquiries', 'clipboard-list', 'sales-enquiry'], ['qt', 'Quotes', 'file-text', 'sales-quotation'], ['so', 'Orders', 'package-check', 'sales-order'], ['more', 'More', 'grid', 'auth-dept-select']],
    production: [['home', 'Home', 'home', 'prod-dashboard'], ['orders', 'Orders', 'clipboard-list', 'prod-order'], ['mat', 'BOM/Mat', 'layers', 'prod-bom'], ['qc', 'Build/QC', 'shield-check', 'prod-qc'], ['more', 'More', 'grid', 'auth-dept-select']],
    'supply-chain': [['home', 'Home', 'home', 'scm-dashboard'], ['req', 'Requests', 'clipboard-list', 'scm-stock'], ['inv', 'Inventory', 'boxes', 'scm-inventory'], ['po', 'PO / GRN', 'shopping-cart', 'scm-grn'], ['more', 'More', 'grid', 'auth-dept-select']],
    logistics: [['home', 'Home', 'home', 'log-dashboard'], ['plan', 'Plan', 'calendar', 'log-plan'], ['disp', 'Dispatch', 'truck', 'log-dispatch'], ['pod', 'POD', 'check-circle-2', 'log-pod'], ['more', 'More', 'grid', 'auth-dept-select']],
    employees: [['home', 'Home', 'home', 'emp-dashboard'], ['emp', 'Staff', 'users', 'emp-list'], ['perm', 'Matrix', 'shield-check', 'emp-matrix'], ['login', 'Login', 'log-in', 'auth-login'], ['more', 'More', 'grid', 'admin-dashboard']]
  };
  const items = navConfig[dept] || navConfig.admin;
  return `<nav class="bg-white border-t border-slate-200 px-1 pt-1.5 pb-2 grid grid-cols-5 shrink-0">${items.map(([k, lbl, ic, sc]) => `<button type="button" data-go="${sc}" class="flex flex-col items-center justify-center gap-0.5 py-0.5 rounded-lg ${k === activeKey ? 'text-[#1E3A8A] font-semibold' : 'text-slate-500 hover:text-slate-800'}"><i data-lucide="${ic}" class="w-4.5 h-4.5 ${k === activeKey ? 'stroke-[2.3]' : ''}"></i><span class="text-[10px]">${lbl}</span></button>`).join('')}</nav>`;
}

/* ==========================================================================
   COMMON AUTHENTICATION SCREENS (SECTION 3)
   ========================================================================== */
function renderSplash() {
  return `<div class="flex-1 bg-[#1E3A8A] text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
    <div class="w-16 h-16 rounded-2xl bg-white text-[#1E3A8A] font-bold text-3xl flex items-center justify-center shadow-lg">C</div>
    <div><div class="text-xl font-bold tracking-tight">Cryo Enterprise ERP</div><div class="text-xs text-blue-200 mt-1">Scientific & Laboratory Equipment Suite</div></div>
    <button type="button" data-go="auth-login" class="mt-4 px-6 py-2.5 rounded-xl bg-white text-[#1E3A8A] text-xs font-bold shadow">Continue to Login →</button>
  </div>`;
}

function renderAuthLogin() {
  return `<div class="phone-scroll p-5 flex flex-col justify-center space-y-4 bg-white">

    document.getElementById(`mode${m}Btn`).className = `px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1 ${db.viewMode === key ? 'bg-[#1E3A8A] text-white shadow-sm' : 'text-slate-600'}`;
  });
  document.getElementById('phoneContainer').classList.toggle('hidden', db.viewMode !== 'phone');
  document.getElementById('workflowContainer').classList.toggle('hidden', db.viewMode !== 'workflow');
  document.getElementById('handoffContainer').classList.toggle('hidden', db.viewMode !== 'handoff');
  renderSidebar();

  if (db.viewMode === 'phone') {
    const root = document.getElementById('screenRoot');
    root.innerHTML = renderScreenMarkup(db.screen);
    lucide.createIcons({ nodes: [root] });
    renderSheet();
    const metaEl = document.getElementById('screenFooterMeta');
    if (metaEl) metaEl.innerHTML = `<span class="px-2 py-0.5 rounded bg-white border border-slate-200 font-semibold text-[#1E3A8A]">${esc(curUser().name)}</span><span>${esc(curUser().label)}</span><span>•</span><span>Screen: <strong>${esc(db.screen)}</strong></span>`;
  } else if (db.viewMode === 'workflow') renderWorkflowView();
  else renderHandoffView();
}

/* ---------- EVENTS ---------- */
document.getElementById('personaSelect').addEventListener('change', (e) => {
  db.personaKey = e.target.value;
  const u = curUser();
  if (u.isAdmin) goScreen('admin-dashboard', 'admin');
  else if (u.depts.length > 1) goScreen('auth-dept-select');
  else goScreen(DEPT_META[u.depts[0]].home, u.depts[0]);
  showToast(`Signed in as ${u.name} (${u.label})`);
});
document.getElementById('modePhoneBtn').addEventListener('click', () => { db.viewMode = 'phone'; renderAll(); });
document.getElementById('modeFlowBtn').addEventListener('click', () => { db.viewMode = 'workflow'; renderAll(); });
document.getElementById('modeHandoffBtn').addEventListener('click', () => { db.viewMode = 'handoff'; renderAll(); });
document.getElementById('sbModeJourneyBtn').addEventListener('click', () => { db.sidebarMode = 'journey'; renderSidebar(); });
document.getElementById('sbModeModulesBtn').addEventListener('click', () => { db.sidebarMode = 'modules'; renderSidebar(); });

const sidebarEl = document.getElementById('screenSidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('toggleSidebarBtn').addEventListener('click', () => { sidebarEl.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); goScreen(go.dataset.go); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === 'go-back') goBack();
  else if (act === 'close-sheet') { db.activeSheet = null; renderSheet(); }
  else if (act === 'open-dept-switcher') { db.activeSheet = { type: 'switch' }; renderSheet(); }
  else if (act === 'do-login') {
    const u = curUser();
    if (u.isAdmin) goScreen('admin-dashboard', 'admin');
    else if (u.depts.length > 1) goScreen('auth-dept-select');
    else goScreen(DEPT_META[u.depts[0]].home, u.depts[0]);
  } else if (act === 'apr') {
    const a = db.approvals.find((x) => x.id === btn.dataset.id);
    if (a) { a.status = btn.dataset.val; logEvent('Admin', `${a.status} ${a.type} (${a.ref})`); renderAll(); showToast(`${a.ref} ${a.status}`); }
  } else if (act === 'add-inline-cust') {
    db.customers.push({ id: `CUST-00${db.customers.length + 1}`, name: 'Nova Bio Labs', contact: 'Dr. Vikram', phone: '+91 98400 77112', email: 'vikram@novabio.in', address: 'Chennai' });
    logEvent('Sales', 'Added Nova Bio Labs to Shared Customer Master');
    renderAll(); showToast('Nova Bio Labs added to Shared Customer Master');
  } else if (act === 'confirm-grn') {
    db.order.grnConfirmed = true;
    db.materials[1].stock += 3; db.materials[2].stock += 2;
    db.order.completedStageNum = Math.max(db.order.completedStageNum, 13);
    logEvent('Supply Chain', 'GRN-001 confirmed (+3 Steel Sheets, +2 Controllers)');
    renderAll(); showToast('GRN-001 confirmed — Live Inventory updated!');
  } else if (act === 'issue-mi2') {
    db.order.mi2Issued = true; db.order.mrStatus = 'Fully Issued'; db.order.proStatus = 'Materials Ready';
    db.materials[1].stock = Math.max(0, db.materials[1].stock - 3);
    db.materials[2].stock = Math.max(0, db.materials[2].stock - 2);
    db.order.completedStageNum = Math.max(db.order.completedStageNum, 15);
    logEvent('Supply Chain', 'MI-002 issued remaining stock → PRO-001 Materials Ready');
    renderAll(); showToast('MI-002 issued — PRO-001 is now Materials Ready!');
  } else if (act === 'pass-qc') {
    db.order.prodProgress = 100; db.order.qcStatus = 'Passed'; db.order.proStatus = 'Completed'; db.order.delStatus = 'Ready to Dispatch';
    db.order.completedStageNum = Math.max(db.order.completedStageNum, 18);
    logEvent('Production', 'PRO-001 build 100%, QC Passed → Sent to Logistics');
    renderAll(); showToast('QC Passed — PRO-001 sent to Logistics!');
  } else if (act === 'do-dispatch') {
    db.order.delStatus = 'In Transit'; db.vehicles[0].status = 'In Transit';
    db.order.completedStageNum = Math.max(db.order.completedStageNum, 20);
    logEvent('Logistics', 'DEL-001 dispatched via TN 01 AB 1234 (DSP-001)');
    renderAll(); showToast('DEL-001 dispatched — In Transit!');
  } else if (act === 'confirm-pod') {
    db.order.podRecorded = true; db.order.delStatus = 'Delivered'; db.order.receivedAmount = db.order.orderValue;
    db.vehicles[0].status = 'Available'; db.order.completedStageNum = 22;
    logEvent('Logistics', 'POD signed, ₹50,000 COD collected → SO-001 Delivered & Paid');
    renderAll(); showToast('SO-001 Delivered, Paid & 22/22 Stages Complete!');
  } else if (act === 'copy-rn') {
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(RN_THEME_JSON);
      else { const ta = document.createElement('textarea'); ta.value = RN_THEME_JSON; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      showToast('Copied React Native Theme & Routes JSON!');
    } catch { showToast('Copy ready from code block below'); }
  }
});

renderAll();
</script>
</body>
</html>

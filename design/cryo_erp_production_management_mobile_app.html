      --text: #0F172A;
      --muted: #64748B;
    }
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #EEF2F6; color: var(--text); overflow-x: hidden; }
    .phone-shell {
      width: 390px;
      max-width: 100%;
      height: 820px;
      max-height: calc(100vh - 76px);
      background: var(--bg);
      border-radius: 36px;
      border: 8px solid #0F172A;
      box-shadow: 0 24px 60px -15px rgba(15, 23, 42, 0.28);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    @media (max-width: 520px) {
      .phone-shell {
        width: 100%;
        height: calc(100vh - 56px);
        max-height: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }
    .phone-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #CBD5E1 transparent;
    }
    .phone-scroll::-webkit-scrollbar { width: 4px; }
    .phone-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sidebar-scroll { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: flex-end;
      z-index: 40;
      animation: fadeIn 0.16s ease-out;
    }
    .sheet-panel {
      width: 100%;
      max-height: 88%;
      background: #FFFFFF;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0.9; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulseBg { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .skeleton { animation: pulseBg 1.4s ease-in-out infinite; background: #E2E8F0; border-radius: 6px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .toast-bar { position: absolute; top: 46px; left: 14px; right: 14px; z-index: 60; animation: fadeIn 0.16s ease-out; }
    .gallery-mini-phone {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 360px;
      background: #F8FAFC;
      border: 3px solid #1E293B;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(30, 58, 138, 0.2);

function calcProgress(pro) {
  if (pro.status === 'Completed') return 100;
  if (!pro.activities || !pro.activities.length) return 0;
  const done = pro.activities.filter((a) => a.status === 'Completed').length;
  const inProg = pro.activities.filter((a) => a.status === 'In Progress').length;
  return Math.min(100, Math.round(((done + inProg * 0.5) / pro.activities.length) * 100));
}

let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('phoneToast');
  if (!el) return;
  const styles = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : 'bg-[#1E3A8A] text-white';
  el.className = `toast-bar rounded-xl px-3.5 py-2.5 text-xs font-medium shadow-lg flex items-center gap-2 ${styles}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(msg)}</span>`;
  el.classList.remove('hidden');
  lucide.createIcons({ nodes: [el] });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

function navigate(screenId, opts = {}) {
  if (opts.key && opts.id) state.selected[opts.key] = opts.id;
  if (!opts.skipHistory && state.screen !== screenId) {
    state.history.push(state.screen);
    if (state.history.length > 25) state.history.shift();
  }
  state.activeSheet = null;
  state.screen = screenId;

  if (screenId === 'create-bom') {
    const pro = getPRO(state.selected.proId);
    state.bomDraft = {
      proId: pro.id, mode: 'new', existingBomId: 'BOM-001', notes: '',
      items: [
        { materialId: 'MAT-01', name: 'Compressor', perUnit: 1, unit: 'units' },
        { materialId: 'MAT-02', name: 'Steel Sheet', perUnit: 4, unit: 'sheets' },
        { materialId: 'MAT-03', name: 'Temperature Controller', perUnit: 1, unit: 'units' }
      ]
    };
  } else if (screenId === 'create-plan') {
    const pro = getPRO(state.selected.proId);
    state.planDraft = {
      proId: pro.id,
      startDate: pro.plannedStart || todayStr(),
      endDate: pro.plannedEnd || pro.targetDate,
      team: pro.team || 'Team A (Deep Freezer Bay)',
      activities: pro.activities && pro.activities.length ? pro.activities.map((a) => ({ ...a })) : [
        { name: 'Fabrication', assignee: 'Senthil Kumar', targetDate: '2026-11-22', status: 'Pending' },
        { name: 'Assembly', assignee: 'Ramesh V', targetDate: '2026-11-26', status: 'Pending' },
        { name: 'Electrical Work', assignee: 'Prakash M', targetDate: '2026-11-29', status: 'Pending' },
        { name: 'Testing', assignee: 'Deepak Raj', targetDate: '2026-12-03', status: 'Pending' },
        { name: 'Finishing', assignee: 'Senthil Kumar', targetDate: '2026-12-05', status: 'Pending' }
      ]
    };
  } else if (screenId === 'add-material-sheet') {
    state.activeSheet = { type: 'add-material' };
  } else if (screenId === 'start-prod-sheet') {
    state.activeSheet = { type: 'start-prod', proId: state.selected.proId };
  } else if (screenId === 'mark-finished-sheet') {
    state.activeSheet = { type: 'mark-finished', proId: state.selected.proId };
  } else if (screenId === 'send-logistics-sheet') {
    state.activeSheet = { type: 'send-logistics', proId: state.selected.proId };
  }

  state.viewMode = 'phone';
  renderAll();
}

function renderProdStepper(activeStep, nextTip) {
  const steps = [
    { n: 1, label: 'Order' },
    { n: 2, label: 'BOM' },
    { n: 3, label: 'Mat.' },
    { n: 4, label: 'Plan' },
    { n: 5, label: 'Build' },
    { n: 6, label: 'QC' },
    { n: 7, label: 'Done' }
  ];
  return `
    <div class="bg-white border border-slate-200 rounded-xl p-3 space-y-2">
      <div class="flex items-center justify-between">
        ${steps.map((s, idx) => {
          const done = s.n < activeStep;
          const curr = s.n === activeStep;
          return `
            <div class="flex items-center ${idx < steps.length - 1 ? 'flex-1' : ''}">
              <div class="flex flex-col items-center gap-0.5 shrink-0">
                <span class="w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center ${
                  done ? 'bg-emerald-600 text-white' : curr ? 'bg-[#1E3A8A] text-white ring-4 ring-blue-100' : 'bg-slate-100 text-slate-400 border border-slate-200'
                }">${done ? '✓' : s.n}</span>
                <span class="text-[9px] ${curr ? 'font-bold text-[#1E3A8A]' : done ? 'text-emerald-700 font-medium' : 'text-slate-400'}">${s.label}</span>
              </div>
              ${idx < steps.length - 1 ? `<div class="h-0.5 flex-1 mx-0.5 -mt-3.5 ${done ? 'bg-emerald-500' : 'bg-slate-200'}"></div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
      ${nextTip ? `<div class="bg-blue-50/80 border border-blue-100 rounded-lg px-2.5 py-1.5 text-[11px] text-[#1E3A8A] flex items-center gap-1.5"><i data-lucide="compass" class="w-3.5 h-3.5 shrink-0"></i><span><strong>Next step:</strong> ${esc(nextTip)}</span></div>` : ''}
    </div>
  `;
}

function getProStepNum(status) {
  const map = { 'BOM Pending': 2, 'Waiting for Materials': 3, 'Materials Ready': 4, 'In Production': 5, 'Quality Check': 6, 'Completed': 7 };
  return map[status] || 1;
}

function getProNextAction(pro) {
  if (pro.status === 'BOM Pending') return { label: 'Next: Prepare BOM →', screen: 'create-bom' };
  if (pro.status === 'Waiting for Materials') {
    const awaitRec = state.materialIssues.find((m) => m.proId === pro.id && m.status === 'Awaiting Receipt');
    if (awaitRec) return { label: 'Next: Confirm Material Receipt →', screen: 'confirm-receipt', key: 'miId', id: awaitRec.id };
    return { label: 'View Material Status →', screen: 'mr-details', key: 'mrId', id: pro.mrId || 'MR-001' };
  }
  if (pro.status === 'Materials Ready') return { label: 'Next: Create Production Plan →', screen: 'create-plan' };
  if (pro.status === 'In Production') return { label: 'Next: Add Daily Update →', screen: 'add-daily-update' };
  if (pro.status === 'Quality Check') return { label: 'Next: Open Quality Check →', screen: 'qc-inspection', key: 'qcId', id: 'QC-001' };
  return { label: 'View Completed Summary →', screen: 'completed-details' };
}

    <div class="bg-white border border-slate-200 rounded-xl p-6 text-center space-y-2">

      <div class="text-sm font-semibold text-slate-900">${title}</div>
      <div class="text-xs text-slate-500">${desc}</div>
      ${btnText ? `<button type="button" data-nav="${btnNav}" class="mt-2 px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-xs font-semibold">${btnText}</button>` : ''}
    </div>`;

  let body = '';
  if (cur === 'no-incoming') body = card('inbox', 'text-slate-300', 'No incoming Sales Orders', 'Confirmed Sales Orders from the Sales Department will appear here automatically.', 'Go to Dashboard', 'dashboard');
  else if (cur === 'no-pro') body = card('clipboard-list', 'text-slate-300', 'No Production Orders yet', 'Convert an incoming Sales Order to start production.', 'View Incoming Orders', 'incoming-so-list');
  else if (cur === 'bom-pending') body = card('list-checks', 'text-amber-500', 'BOM Pending for PRO-001', 'Prepare or select an existing Bill of Materials before requesting raw materials.', 'Prepare BOM', 'create-bom');
  else if (cur === 'waiting-mat') body = card('clock', 'text-amber-500', 'Waiting for Materials', 'MR-001 has been sent to Supply Chain. Production will start once materials are issued.', 'View Material Request', 'mr-details');
  else if (cur === 'partial-mat') body = card('package-open', 'text-amber-500', 'Partially Received Materials', 'Compressor (2/2) and Steel Sheet (5/8) received. 3 Steel Sheets and 2 Controllers pending.', 'View Material Status', 'mr-details');
  else if (cur === 'mat-ready') body = card('package-check', 'text-emerald-500', 'All Materials Ready', 'All required materials for PRO-001 have been received and verified.', 'Create Production Plan', 'create-plan');
  else if (cur === 'no-daily') body = card('wrench', 'text-slate-300', 'No daily production updates', 'Log today’s work progress to keep delivery schedules on track.', 'Add Daily Update', 'add-daily-update');
  else if (cur === 'no-qc') body = card('shield-check', 'text-emerald-400', 'No pending quality checks', 'All finished equipment units have been inspected.', 'View Completed Orders', 'completed-list');
  else if (cur === 'loading') body = `<div class="space-y-2.5">${[1, 2, 3].map(() => `<div class="bg-white border border-slate-200 rounded-xl p-3.5 space-y-2"><div class="h-3 w-24 skeleton"></div><div class="h-4 w-44 skeleton"></div><div class="h-3 w-full skeleton"></div></div>`).join('')}</div>`;
  else if (cur === 'success') body = card('check-circle-2', 'text-emerald-500', 'Sent to Logistics Successfully', 'PRO-003 (Laboratory Incubator × 2) has been handed over to Logistics.', 'View Completed List', 'completed-list');
  else if (cur === 'validation') body = `<div class="bg-white border border-slate-200 rounded-xl p-4 space-y-2 text-xs"><div class="bg-rose-50 border border-rose-200 rounded-lg p-2.5 text-rose-700">Received quantity (10) cannot exceed issued quantity (5).</div><div><label class="font-medium block mb-1">Remarks *</label><input type="text" class="w-full px-3 py-2 bg-rose-50/40 border border-rose-400 rounded-lg" /><div class="text-[11px] text-rose-600 mt-1">Remarks are required when reporting a shortage.</div></div></div>`;
  else if (cur === 'network') body = card('wifi-off', 'text-rose-400', 'Unable to sync with Cryo ERP', 'Check your internet connection and tap retry.', 'Retry Sync', 'dashboard');
  else body = `<div class="bg-white border border-slate-200 rounded-xl p-5 space-y-3"><div class="text-sm font-semibold text-slate-900">Confirm Handover to Logistics?</div><div class="text-xs text-slate-600">Once sent, PRO-003 cannot be submitted again to Logistics.</div><div class="grid grid-cols-2 gap-2"><button type="button" data-nav="completed-list" class="py-2 rounded-lg border border-slate-200 text-xs font-semibold">Cancel</button><button type="button" data-action="open-logistics" data-id="PRO-003" class="py-2 rounded-lg bg-[#1E3A8A] text-white text-xs font-semibold">Confirm</button></div></div>`;

  return `
    ${renderTopBar('Common UI States (13)', { back: true, fallback: 'more' })}
    <div class="bg-white border-b border-slate-200 px-3 py-2 flex gap-1.5 overflow-x-auto no-scrollbar shrink-0">
      ${list.map(([id, lbl]) => `<button type="button" data-action="set-ui-state" data-val="${id}" class="px-2.5 py-1 rounded-full text-[11px] font-medium whitespace-nowrap border ${cur === id ? 'bg-[#1E3A8A] text-white border-[#1E3A8A]' : 'bg-white text-slate-600 border-slate-200'}">${lbl}</button>`).join('')}
    </div>
    <div class="phone-scroll p-3.5 flex flex-col justify-center">${body}</div>
  `;
}

function renderSheet() {
  const root = document.getElementById('sheetRoot');
  if (!state.activeSheet) { root.className = 'hidden'; root.innerHTML = ''; return; }
  const s = state.activeSheet;
  let title = '', content = '', footer = '';

  if (s.type === 'add-material') {
    title = 'Request New Material';
    content = `
      <div class="space-y-2.5">
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Material Name *</label><input id="shMatName" type="text" placeholder="e.g., Silicone Door Gasket" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" /></div>
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Unit *</label><input id="shMatUnit" type="text" placeholder="meters / units / kg" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" /></div>
        <div><label class="block text-xs font-medium text-slate-700 mb-1">Specification (Optional)</label><input id="shMatSpec" type="text" placeholder="Low-temp cryo grade" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" /></div>
        <div class="text-[11px] text-slate-500">${currentUser().canDirectCreateMaterial ? 'As Manager, this material will be added directly to Material Master.' : 'Will be sent to Supply Chain for Material Master approval.'}</div>
      </div>`;
    footer = `<button type="button" data-action="close-sheet" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold">Cancel</button><button type="button" data-action="save-new-mat" class="flex-1 py-2.5 rounded-xl bg-[#1E3A8A] text-white text-xs font-semibold">Submit Material Request</button>`;
  } else if (s.type === 'start-prod') {
    const pro = getPRO(s.proId || state.selected.proId);
    title = 'Start Production';
    content = `
      <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-3 text-xs space-y-1">
        <div class="font-semibold text-[#1D4ED8]">${esc(pro.id)} • ${esc(pro.product)} (${pro.qty} units)</div>
        <div>Team: <strong>${esc(pro.team || 'Team A')}</strong></div>
        <div>Activities: ${pro.activities.map((a) => a.name).join(' → ')}</div>
      </div>`;
    footer = `<button type="button" data-action="close-sheet" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold">Cancel</button><button type="button" data-action="confirm-start-prod" data-id="${pro.id}" class="flex-1 py-2.5 rounded-xl bg-[#1E3A8A] text-white text-xs font-semibold">Confirm & Start Production</button>`;
  } else if (s.type === 'mark-finished') {
    const pro = getPRO(s.proId || state.selected.proId);
    title = 'Mark Production Finished';
    content = `
      <div class="space-y-3 text-xs">
        <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-3 space-y-1">
          <div class="font-semibold text-[#1D4ED8]">${esc(pro.id)} • ${esc(pro.product)}</div>
          <div>Quantity: <strong>${pro.qty} units</strong> • Moves to Quality Check Pending.</div>
        </div>
        <div><label class="block font-medium text-slate-700 mb-1">Completion Date</label><input id="shFinDate" type="date" value="${todayStr()}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg" /></div>
        <div><label class="block font-medium text-slate-700 mb-1">Remarks (Optional)</label><input id="shFinRem" type="text" placeholder="Ready for QC inspection..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg" /></div>
      </div>`;
    footer = `<button type="button" data-action="close-sheet" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold">Cancel</button><button type="button" data-action="confirm-mark-finished" data-id="${pro.id}" class="flex-1 py-2.5 rounded-xl bg-[#1E3A8A] text-white text-xs font-semibold">Send for Quality Check</button>`;
  } else if (s.type === 'send-logistics') {
    const pro = getPRO(s.proId || state.selected.proId);
    title = 'Send to Logistics';
    content = `
      <div class="space-y-3 text-xs">
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 space-y-1">
          <div class="font-semibold text-emerald-800">${esc(pro.id)} • ${esc(pro.soId)}</div>
          <div class="text-slate-800">${esc(pro.customer)} — ${esc(pro.product)} (${pro.qty} units QC Approved)</div>
          <div class="text-slate-500">Expected Delivery: ${esc(pro.targetDate)}</div>
        </div>
        <div><label class="block font-medium text-slate-700 mb-1">Packing / Handling Instructions (Optional)</label><textarea id="shLogNotes" rows="2" placeholder="Keep upright, fragile glass door, attach NABL certs..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea></div>

  root.className = 'sheet-backdrop';
  root.innerHTML = `
    <div class="sheet-panel">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between"><h2 class="text-sm font-semibold text-slate-900">${esc(title)}</h2><button type="button" data-action="close-sheet" class="p-1 rounded-lg text-slate-400"><i data-lucide="x" class="w-4 h-4"></i></button></div>

      <div class="px-4 py-3 border-t border-slate-200 flex items-center gap-2 bg-white">${footer}</div>
    </div>`;
  lucide.createIcons({ nodes: [root] });
}

      { step: '3', title: 'Material Request & Receipt', desc: 'Send MR-001 to Supply Chain & confirm MI-001', screen: 'mr-details', group: ['mr-list', 'create-mr', 'mr-details', 'receipt-list', 'confirm-receipt', 'receipt-details'] },

      { step: '5', title: 'Daily Production Updates', desc: 'Log work completed, issues & finish build', screen: 'prod-progress', group: ['daily-list', 'add-daily-update', 'daily-update-details', 'prod-progress', 'additional-mr', 'mark-finished-sheet'] },
      { step: '6', title: 'Quality Check & Rework', desc: 'Inspect units, rework failures or pass QC', screen: 'qc-inspection', group: ['qc-list', 'qc-inspection', 'qc-result', 'create-rework', 'rework-details'] },
      { step: '7', title: 'Complete → Send to Logistics', desc: 'Final approval & handover to Logistics', screen: 'completed-details', group: ['complete-prod', 'completed-list', 'completed-details', 'send-logistics-sheet'] }
    ];
    container.innerHTML = `
      <div class="px-1.5 pt-1 pb-2"><div class="text-xs font-semibold text-slate-900">Simple Production Flow</div><div class="text-[11px] text-slate-500 mt-0.5">Tap any stage to try it live in the phone.</div></div>

          const active = state.viewMode === 'phone' && s.group.includes(state.screen);
          return `<button type="button" data-sidebar-screen="${s.screen}" class="w-full p-2.5 rounded-xl text-left border transition flex items-start gap-2.5 ${active ? 'bg-[#1E3A8A] text-white border-[#1E3A8A] shadow-sm' : 'bg-white text-slate-800 border-slate-200 hover:border-[#1D4ED8]'}">
            <span class="w-6 h-6 rounded-full text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5 ${active ? 'bg-white text-[#1E3A8A]' : 'bg-blue-50 text-[#1E3A8A]'}">${s.step}</span>
            <div class="min-w-0"><div class="text-xs font-semibold leading-tight">${esc(s.title)}</div><div class="text-[11px] mt-0.5 leading-snug ${active ? 'text-blue-100' : 'text-slate-500'}">${esc(s.desc)}</div></div>

function renderAll() {
  ['Phone', 'Gallery', 'Flow'].forEach((m) => {
    const key = m.toLowerCase() === 'flow' ? 'workflow' : m.toLowerCase();
    document.getElementById(`mode${m}Btn`).className = `px-2.5 py-1 text-xs font-medium rounded-md transition flex items-center gap-1 ${state.viewMode === key ? 'bg-[#1E3A8A] text-white shadow-sm' : 'text-slate-600'}`;
  });
  document.getElementById('phoneContainer').classList.toggle('hidden', state.viewMode !== 'phone');
  document.getElementById('galleryContainer').classList.toggle('hidden', state.viewMode !== 'gallery');
  document.getElementById('workflowContainer').classList.toggle('hidden', state.viewMode !== 'workflow');
  renderSidebar();

  if (state.viewMode === 'phone') {
    const root = document.getElementById('screenRoot');
    root.innerHTML = renderScreenMarkup(state.screen);
    lucide.createIcons({ nodes: [root] });
    renderSheet();
    const meta = SCREEN_CATALOG.flatMap((g) => g.items).find((i) => i.id === state.screen);
    const metaEl = document.getElementById('screenFooterMeta');
    if (meta && metaEl) metaEl.innerHTML = `<span class="px-2 py-0.5 rounded bg-white border border-slate-200 font-semibold text-[#1E3A8A]">Screen #${meta.num}</span><span>${esc(meta.title)}</span><span>•</span><span><strong>${esc(currentUser().role)}</strong></span>`;
  } else if (state.viewMode === 'gallery') renderGallery();
  else renderWorkflowMap();
}

const sidebarEl = document.getElementById('screenSidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('toggleSidebarBtn').addEventListener('click', () => { sidebarEl.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });

document.addEventListener('input', (e) => {
  const f = e.target.dataset.filter;
  if (f) {
    state.filters[f] = e.target.value;
    const pos = e.target.selectionStart;
    renderAll();
    const el = document.querySelector(`[data-filter="${f}"]`);
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }
  if (e.target.dataset.bomQty !== undefined && state.bomDraft) {
    state.bomDraft.items[Number(e.target.dataset.bomQty)].perUnit = Math.max(1, Number(e.target.value) || 1);
    renderAll();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'bomTemplateSelect' && state.bomDraft) {
    const b = getBOM(e.target.value);
    state.bomDraft.existingBomId = b.id;
    state.bomDraft.items = b.items.map((i) => ({ ...i }));
    renderAll();
  } else if (e.target.dataset.bomMat !== undefined && state.bomDraft) {
    const mat = state.materialMaster.find((m) => m.id === e.target.value);
    if (mat) Object.assign(state.bomDraft.items[Number(e.target.dataset.bomMat)], { materialId: mat.id, name: mat.name, unit: mat.unit });
    renderAll();
  }
});

document.addEventListener('click', (e) => {
  const sb = e.target.closest('[data-sidebar-screen]');
  if (sb) { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); navigate(sb.dataset.sidebarScreen); return; }
  const gc = e.target.closest('[data-gallery-cat]');
  if (gc) { state.galleryCategory = gc.dataset.galleryCat; renderGallery(); return; }
  const go = e.target.closest('[data-gallery-open]');
  if (go) { navigate(go.dataset.galleryOpen); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  const opn = e.target.closest('[data-open]');
  if (opn) { navigate(opn.dataset.open, { key: opn.dataset.key, id: opn.dataset.id }); return; }
  const ft = e.target.closest('[data-filter-tab]');
  if (ft) { state.filters[ft.dataset.filterTab] = ft.dataset.val; renderAll(); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === 'go-back') goBack(btn.dataset.fallback || 'dashboard');
  else if (act === 'close-sheet') { state.activeSheet = null; renderSheet(); }
  else if (act === 'open-sheet') { state.activeSheet = { type: btn.dataset.sheet }; renderSheet(); }
  else if (act === 'save-pro') {
    const so = getSO(btn.dataset.so);
    const p = so.products[0];
    const newId = `PRO-00${state.productionOrders.length + 1}`;
    state.productionOrders.unshift({
      id: newId, soId: so.id, customer: so.customer, product: p.name, model: p.model, qty: p.qty, completedQty: 0,
      priority: document.getElementById('proPriority')?.value || 'Normal',
      createdDate: todayStr(), targetDate: document.getElementById('proTargetDate')?.value || so.expectedDelivery,
      actualStart: '', status: 'BOM Pending', specs: p.specs, req: p.req,
      notes: document.getElementById('proNotes')?.value || '', bomId: '', mrId: '', team: '', plannedStart: '', plannedEnd: '',
      dispatchStatus: 'Not Ready', activities: []
    });
    so.status = 'Converted'; so.proId = newId;
    navigate('pro-details', { key: 'proId', id: newId });
    showToast(`${newId} created — Next: Prepare BOM`);
  } else if (act === 'save-edit-pro') {
    const pro = getPRO(btn.dataset.id);
    pro.priority = document.getElementById('editProPriority')?.value || pro.priority;
    pro.targetDate = document.getElementById('editProTarget')?.value || pro.targetDate;
    pro.notes = document.getElementById('editProNotes')?.value || pro.notes;
    navigate('pro-details'); showToast(`${pro.id} updated`);
  } else if (act === 'bom-mode') { state.bomDraft.mode = btn.dataset.val; renderAll(); }
  else if (act === 'bom-add') { state.bomDraft.items.push({ materialId: 'MAT-04', name: 'PUF Insulation Foam', perUnit: 2, unit: 'kg' }); renderAll(); }
  else if (act === 'bom-remove') { state.bomDraft.items.splice(Number(btn.dataset.idx), 1); renderAll(); }
  else if (act === 'save-new-mat') {
    const name = (document.getElementById('shMatName')?.value || '').trim();
    const unit = (document.getElementById('shMatUnit')?.value || '').trim() || 'units';
    if (!name) { showToast('Material name is required', 'error'); return; }
    const newMat = { id: `MAT-0${state.materialMaster.length + 1}`, name, unit, spec: document.getElementById('shMatSpec')?.value || '' };
    state.materialMaster.push(newMat);
    if (state.bomDraft) state.bomDraft.items.push({ materialId: newMat.id, name, perUnit: 1, unit });
    state.activeSheet = null; renderAll();
    showToast(currentUser().canDirectCreateMaterial ? `${name} added to Material Master` : `New material request sent to Supply Chain`);
  } else if (act === 'save-bom') {
    const pro = getPRO(state.bomDraft.proId);
    const newId = `BOM-00${state.boms.length + 1}`;
    state.boms.unshift({ id: newId, proId: pro.id, product: pro.product, model: pro.model, qty: pro.qty, version: 'v1.0', status: btn.dataset.status, notes: '', items: state.bomDraft.items.map((i) => ({ ...i })) });
    pro.bomId = newId;
    navigate('bom-details', { key: 'bomId', id: newId });
    showToast(`${newId} saved as ${btn.dataset.status}`);
  } else if (act === 'save-mr') {
    const b = getBOM(btn.dataset.bom);
    const pro = getPRO(b.proId);
    const newId = `MR-00${state.materialRequests.length + 1}`;
    state.materialRequests.unshift({
      id: newId, proId: pro.id, bomId: b.id, product: b.product,
      requestDate: todayStr(), requiredDate: document.getElementById('mrReqDate')?.value || '2026-11-23',
      status: 'Pending', notes: document.getElementById('mrNotes')?.value || '',
      items: b.items.map((i) => ({ name: i.name, unit: i.unit, requested: i.perUnit * b.qty, issued: 0, received: 0 }))
    });
    pro.mrId = newId; pro.status = 'Waiting for Materials';
    navigate('mr-details', { key: 'mrId', id: newId });
    showToast(`${newId} sent to Supply Chain`);
  } else if (act === 'confirm-receipt-save') {
    const mi = getMI(btn.dataset.id);
    let diff = false;
    document.querySelectorAll('[data-rec-qty]').forEach((el) => {
      const idx = Number(el.dataset.recQty);
      const val = Number(el.value) || 0;
      if (val > mi.items[idx].issued) { showToast('Received qty cannot exceed issued qty', 'error'); diff = 'err'; return; }
      mi.items[idx].received = val;
      if (val < mi.items[idx].issued) diff = true;
    });
    if (diff === 'err') return;
    const rem = (document.getElementById('recRemarks')?.value || '').trim();
    if (diff && !rem) { showToast('Remarks required for shortage/damage', 'error'); return; }
    mi.status = diff ? 'Partially Received' : 'Fully Received';
    mi.receivedDate = document.getElementById('recDate')?.value || todayStr();
    mi.receivedBy = currentUser().name;
    mi.remarks = rem;
    const pro = getPRO(mi.proId);
    if (!diff && pro.status === 'Waiting for Materials') pro.status = 'Materials Ready';
    navigate('receipt-details', { key: 'miId', id: mi.id });
    showToast(`${mi.id} receipt confirmed`);
  } else if (act === 'plan-add') { state.planDraft.activities.push({ name: 'Quality Prep', assignee: 'Deepak Raj', targetDate: todayStr(), status: 'Pending' }); renderAll(); }
  else if (act === 'plan-remove') { state.planDraft.activities.splice(Number(btn.dataset.idx), 1); renderAll(); }
  else if (act === 'save-plan') {
    const pro = getPRO(state.planDraft.proId);
    pro.plannedStart = document.getElementById('planStart')?.value || todayStr();
    pro.plannedEnd = document.getElementById('planEnd')?.value || pro.targetDate;
    pro.team = document.getElementById('planTeam')?.value || 'Team A';
    document.querySelectorAll('[data-plan-act]').forEach((el) => { state.planDraft.activities[Number(el.dataset.planAct)].name = el.value; });
    document.querySelectorAll('[data-plan-ass]').forEach((el) => { state.planDraft.activities[Number(el.dataset.planAss)].assignee = el.value; });
    pro.activities = state.planDraft.activities.map((a) => ({ ...a }));
    navigate('plan-details', { key: 'proId', id: pro.id });
    showToast(`Production plan saved for ${pro.id}`);
  } else if (act === 'confirm-start-prod') {
    const pro = getPRO(btn.dataset.id);
    pro.status = 'In Production'; pro.actualStart = todayStr();
    if (pro.activities.length && pro.activities[0].status === 'Pending') pro.activities[0].status = 'In Progress';
    state.activeSheet = null; navigate('prod-progress', { key: 'proId', id: pro.id });
    showToast(`${pro.id} started — Status: In Production`);
  } else if (act === 'save-daily-update') {
    const pro = getPRO(btn.dataset.pro);
    const summary = (document.getElementById('duSummary')?.value || '').trim();
    if (!summary) { showToast('Enter work summary', 'error'); return; }
    const actName = document.getElementById('duActivity')?.value;
    const st = document.getElementById('duStatus')?.value || 'In Progress';
    const delta = Number(document.getElementById('duQty')?.value) || 0;
    const foundAct = pro.activities.find((a) => a.name === actName);
    if (foundAct) foundAct.status = st;
    pro.completedQty = Math.min(pro.qty, pro.completedQty + delta);
    state.dailyUpdates.unshift({ id: `UPD-0${state.dailyUpdates.length + 1}`, proId: pro.id, activity: actName, date: document.getElementById('duDate')?.value || todayStr(), updatedBy: currentUser().name, status: st, completedDelta: delta, summary, issues: document.getElementById('duIssues')?.value || '', photo: '' });
    navigate('prod-progress', { key: 'proId', id: pro.id });
    showToast('Daily production update saved');
  } else if (act === 'save-add-mr') {
    const pro = getPRO(btn.dataset.pro);
    const newId = `MR-00${state.materialRequests.length + 1}`;
    state.materialRequests.unshift({
      id: newId, proId: pro.id, bomId: pro.bomId || 'BOM-001', product: pro.product,
      requestDate: todayStr(), requiredDate: todayStr(), status: 'Pending',
      notes: `Additional (${document.getElementById('addMrReason')?.value})`,
      items: [{ name: document.getElementById('addMrMat')?.value, unit: 'units', requested: Number(document.getElementById('addMrQty')?.value) || 1, issued: 0, received: 0 }]
    });
    navigate('mr-details', { key: 'mrId', id: newId });
    showToast(`Additional request ${newId} sent to Supply Chain`);
  } else if (act === 'confirm-mark-finished') {
    const pro = getPRO(btn.dataset.id);
    pro.status = 'Quality Check'; pro.completedQty = pro.qty;
    state.activeSheet = null; navigate('qc-list');
    showToast(`${pro.id} sent for Quality Check`);
  } else if (act === 'qc-item-set') {
    const qc = getQC(btn.dataset.qc);
    qc.checklist[Number(btn.dataset.idx)].result = btn.dataset.val;
    renderAll();
  } else if (act === 'submit-qc') {
    const qc = getQC(btn.dataset.id);
    qc.inspectedQty = Number(document.getElementById('qcInspQty')?.value) || qc.qty;
    qc.passedQty = Number(document.getElementById('qcPassQty')?.value) || 0;
    qc.failedQty = Number(document.getElementById('qcFailQty')?.value) || 0;
    const anyFail = qc.failedQty > 0 || qc.checklist.some((c) => c.result === 'Fail');
    qc.status = anyFail ? 'Failed' : 'Passed';
    navigate('qc-result', { key: 'qcId', id: qc.id });
    showToast(anyFail ? 'QC Failed — Create Rework' : 'QC Passed — Ready to Complete Production');
  } else if (act === 'save-rework') {
    const qc = getQC(state.selected.qcId);
    const newId = `RW-00${state.reworks.length + 1}`;
    state.reworks.unshift({ id: newId, proId: qc.proId, qcId: qc.id, product: qc.product, failedQty: Math.max(1, qc.failedQty), issue: document.getElementById('rwIssue')?.value || '', action: document.getElementById('rwAction')?.value || '', assignee: document.getElementById('rwAssignee')?.value || 'Manoj K', targetDate: document.getElementById('rwDate')?.value || todayStr(), status: 'Assigned', workCompleted: '', remarks: '' });
    navigate('rework-details', { key: 'reworkId', id: newId });
    showToast(`${newId} assigned`);
  } else if (act === 'rework-step') {
    const rw = getRW(btn.dataset.id);
    rw.workCompleted = document.getElementById('rwWorkNotes')?.value || rw.workCompleted;
    if (btn.dataset.status === 'Reinspection') {
      rw.status = 'Completed';
      const qc = getQC(rw.qcId); qc.status = 'Pending';
      navigate('qc-inspection', { key: 'qcId', id: qc.id });
      showToast('Rework done — Sent for Reinspection');
    } else { rw.status = 'In Progress'; renderAll(); showToast('Rework started'); }
  } else if (act === 'confirm-complete-prod') {
    const pro = getPRO(btn.dataset.id);
    pro.status = 'Completed'; pro.completionDate = todayStr(); pro.dispatchStatus = 'Ready for Dispatch';
    navigate('completed-details', { key: 'proId', id: pro.id });
    showToast(`${pro.id} marked Completed!`);
  } else if (act === 'open-logistics') {
    state.selected.proId = btn.dataset.id;
    state.activeSheet = { type: 'send-logistics', proId: btn.dataset.id };
    renderSheet();
  } else if (act === 'confirm-send-logistics') {
    const pro = getPRO(btn.dataset.id);
    pro.dispatchStatus = 'Sent to Logistics';
    state.activeSheet = null;
    navigate('completed-details', { key: 'proId', id: pro.id });
    showToast(`${pro.id} handed over to Logistics Department`);
  } else if (act === 'download-report') showToast(`Downloaded ${btn.dataset.doc}`);
  else if (act === 'open-notif') {
    const n = state.notifications.find((x) => x.id === btn.dataset.id);
    if (n) { n.unread = false; navigate(n.screen, { key: n.key, id: n.idVal }); }
  } else if (act === 'mark-all-read') { state.notifications.forEach((n) => { n.unread = false; }); renderAll(); showToast('All notifications marked as read'); }
  else if (act === 'set-ui-state') { state.uiStateDemo = btn.dataset.val; renderAll(); }
  else if (act === 'change-password') showToast(`Password reset sent to ${currentUser().email}`);
  else if (act === 'logout') showToast('Signed out of Cryo ERP Production');
});

renderAll();
</script>
</body>
</html>

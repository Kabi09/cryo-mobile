    body { margin: 0; background: #EEF2F6; color: var(--text); overflow-x: hidden; }
    .phone-shell {
      width: 390px; max-width: 100%; height: 820px; max-height: calc(100vh - 76px);
      background: var(--bg); border-radius: 36px; border: 8px solid #0F172A;
      box-shadow: 0 24px 60px -15px rgba(15, 23, 42, 0.28);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    @media (max-width: 520px) {
      .phone-shell { width: 100%; height: calc(100vh - 56px); max-height: none; border-radius: 0; border: none; box-shadow: none; }
    }
    .phone-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
    .phone-scroll::-webkit-scrollbar { width: 4px; }
    .phone-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sidebar-scroll { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: flex-end; z-index: 40; animation: fadeIn 0.16s ease-out; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0.9; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulseBg { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .skeleton { animation: pulseBg 1.4s ease-in-out infinite; background: #E2E8F0; border-radius: 6px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .toast-bar { position: absolute; top: 46px; left: 14px; right: 14px; z-index: 60; animation: fadeIn 0.16s ease-out; }
    .gallery-mini-phone { width: 100%; aspect-ratio: 9 / 16; max-height: 360px; background: #F8FAFC; border: 3px solid #1E293B; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .gallery-mini-phone:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(30, 58, 138, 0.2); border-color: #1D4ED8; }

function badgeHTML(status) {
  const map = {
    'Active': 'bg-emerald-50 text-emerald-700 border-emerald-200',
    'Inactive': 'bg-rose-50 text-rose-700 border-rose-200',
    'Login Not Created': 'bg-amber-50 text-amber-700 border-amber-200',
    'Password Reset Required': 'bg-amber-50 text-amber-700 border-amber-200',
    'Role Based': 'bg-blue-50 text-blue-700 border-blue-200',
    'Custom Permissions': 'bg-purple-50 text-purple-700 border-purple-200',
    'Mixed Access': 'bg-indigo-50 text-indigo-700 border-indigo-200'
  };
  return `<span class="inline-flex items-center px-2 py-0.5 text-[11px] font-medium rounded-full border ${map[status] || 'bg-slate-100 text-slate-700 border-slate-200'} whitespace-nowrap">${esc(status)}</span>`;
}

let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('phoneToast');
  if (!el) return;
  const cls = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : 'bg-[#1E3A8A] text-white';
  el.className = `toast-bar rounded-xl px-3.5 py-2.5 text-xs font-medium shadow-lg flex items-center gap-2 ${cls}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(msg)}</span>`;
  el.classList.remove('hidden');
  lucide.createIcons({ nodes: [el] });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

function navigate(screenId, opts = {}) {
  if (opts.key && opts.val) state.selected[opts.key] = opts.val;
  if (!opts.skipHistory && state.screen !== screenId) {
    state.history.push(state.screen);
    if (state.history.length > 25) state.history.shift();
  }
  state.activeSheet = null;
  state.screen = screenId;
  if (screenId === 'toggle-account-sheet') state.activeSheet = { type: 'toggle-acc', empId: state.selected.empId };
  state.viewMode = 'phone';
  renderAll();
}

function goBack(fallback = 'dashboard') {
  state.activeSheet = null;
  state.screen = state.history.length ? state.history.pop() : fallback;
  renderAll();
}

  return `<div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between gap-2 shrink-0"><div class="flex items-center gap-2 min-w-0">${back}<h1 class="text-[15px] font-semibold text-slate-900 truncate">${esc(title)}</h1></div><div class="flex items-center gap-1.5 shrink-0">${opts.right || ''}</div></div>`;

document.getElementById('sbModeFlowBtn').addEventListener('click', () => { state.sidebarMode = 'flow'; renderSidebar(); });
document.getElementById('sbModeAllBtn').addEventListener('click', () => { state.sidebarMode = 'all'; renderSidebar(); });
document.getElementById('sidebarSearch').addEventListener('input', () => renderSidebar());

const sidebarEl = document.getElementById('screenSidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
document.getElementById('toggleSidebarBtn').addEventListener('click', () => { sidebarEl.classList.toggle('-translate-x-full'); sidebarOverlay.classList.toggle('hidden'); });
sidebarOverlay.addEventListener('click', () => { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); });

document.addEventListener('input', (e) => {
  const f = e.target.dataset.filter;
  if (f) { state.filters[f] = e.target.value; const p = e.target.selectionStart; renderAll(); const el = document.querySelector(`[data-filter="${f}"]`); if (el) { el.focus(); el.setSelectionRange(p, p); } }
});

document.addEventListener('change', (e) => {
  if (e.target.dataset.pmDept) {
    const emp = getEmp(state.selected.empId);
    const { pmDept, pmSc, pmK } = e.target.dataset;
    if (!emp.permissions[pmDept]) emp.permissions[pmDept] = {};
    if (!emp.permissions[pmDept][pmSc]) emp.permissions[pmDept][pmSc] = { view: false, create: false, edit: false, process: false };
    emp.permissions[pmDept][pmSc][pmK] = e.target.checked;
    if (e.target.checked) emp.permissions[pmDept][pmSc].view = true;
    emp.accessType = 'Custom Permissions';
  }
});

document.addEventListener('click', (e) => {
  const sb = e.target.closest('[data-sidebar-screen]');
  if (sb) { sidebarEl.classList.add('-translate-x-full'); sidebarOverlay.classList.add('hidden'); navigate(sb.dataset.sidebarScreen); return; }
  const gc = e.target.closest('[data-gallery-cat]');
  if (gc) { state.galleryCategory = gc.dataset.galleryCat; renderGallery(); return; }
  const go = e.target.closest('[data-gallery-open]');
  if (go) { navigate(go.dataset.galleryOpen); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  const opn = e.target.closest('[data-open]');
  if (opn) { navigate(opn.dataset.open, { key: opn.dataset.key, val: opn.dataset.val }); return; }
  const ft = e.target.closest('[data-filter-tab]');
  if (ft) { state.filters[ft.dataset.filterTab] = ft.dataset.val; renderAll(); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === 'go-back') goBack(btn.dataset.fallback || 'dashboard');
  else if (act === 'close-sheet') { state.activeSheet = null; renderSheet(); }
  else if (act === 'open-sheet') { state.activeSheet = { type: btn.dataset.sheet, empId: state.selected.empId }; renderSheet(); }
  else if (act === 'toast') showToast(btn.dataset.msg);
  else if (act === 'toggle-pwd-vis') { state.showLoginPwd = !state.showLoginPwd; renderAll(); }
  else if (act === 'gen-pwd') { state.tempGeneratedPwd = 'Cryo@' + Math.floor(1000 + Math.random() * 9000) + '#K'; renderAll(); showToast('Generated temporary password'); }
  else if (act === 'set-emp-tab') { state.selected.empDetailTab = btn.dataset.val; renderAll(); }
  else if (act === 'set-perm-dept') { state.selected.permDeptTab = btn.dataset.val; renderAll(); }
  else if (act === 'save-emp') {
    const name = (document.getElementById('eName')?.value || '').trim();
    const email = (document.getElementById('eEmail')?.value || '').trim();
    if (!name || !email) { showToast('Name & email are required', 'error'); return; }
    if (btn.dataset.mode === 'edit') {
      const emp = getEmp(state.selected.empId);
      Object.assign(emp, { name, email, phone: document.getElementById('ePhone')?.value || '', designation: document.getElementById('eDesig')?.value || '' });
      addAuditLog('Employee updated', `Updated profile details`, `${emp.name} (${emp.id})`, 'Previous profile', `${name} • ${email}`);
      navigate('employee-details'); showToast('Employee updated');
    } else {
      if (state.employees.some((x) => x.email.toLowerCase() === email.toLowerCase())) { showToast('Duplicate login email is not allowed', 'error'); return; }
      const depts = Array.from(document.querySelectorAll('input[name="eDepts"]:checked')).map((el) => el.value);
      const loginOn = document.getElementById('eEnableLogin')?.checked;
      const newId = `EMP-00${state.employees.length + 1}`;
      state.employees.unshift({
        id: newId, name, email, phone: document.getElementById('ePhone')?.value || '', designation: document.getElementById('eDesig')?.value || 'Executive',
        accountStatus: loginOn ? 'Active' : 'Login Not Created', isLastAdmin: false, accountCreated: loginOn ? '2026-11-20' : '', lastLogin: 'Never',
        pwdResetRequired: !!loginOn, accessType: 'Role Based', departments: depts.length ? depts : ['Sales Management'], deptRoles: {}, permissions: {}, workflowActions: {}
      });
      addAuditLog('Employee created', `Created employee (${loginOn ? 'Login Active' : 'No Login'})`, `${name} (${newId})`, '—', depts.join(', '));
      navigate('employee-details', { key: 'empId', val: newId }); showToast(`${newId} created`);
    }
  } else if (act === 'save-assign-depts') {
    const emp = getEmp(btn.dataset.id);
    const prev = emp.departments.join(', ');
    emp.departments = Array.from(document.querySelectorAll('input[name="assignDept"]:checked')).map((el) => el.value);
    addAuditLog('Department assigned', 'Updated department eligibility', `${emp.name} (${emp.id})`, prev, emp.departments.join(', ') || 'None');
    navigate('employee-details'); showToast('Department access saved');
  } else if (act === 'save-dept') {
    const name = (document.getElementById('dName')?.value || '').trim();
    if (!name) { showToast('Department name required', 'error'); return; }
    if (btn.dataset.mode === 'edit') {
      Object.assign(getDept(state.selected.deptId), { name, module: document.getElementById('dMod')?.value, desc: document.getElementById('dDesc')?.value, status: document.getElementById('dStat')?.value });
      navigate('department-details'); showToast('Department updated');
    } else {
      state.departments.push({ id: `DEPT-0${state.departments.length + 1}`, code: name.slice(0, 4).toUpperCase(), name, module: document.getElementById('dMod')?.value, desc: document.getElementById('dDesc')?.value || '', status: 'Active' });
      navigate('departments-list'); showToast(`${name} added`);
    }
  } else if (act === 'save-role') {
    const name = (document.getElementById('rName')?.value || '').trim();
    if (!name) { showToast('Role name required', 'error'); return; }
    if (btn.dataset.mode === 'edit') {
      const r = getRole(state.selected.roleId); r.name = name; r.desc = document.getElementById('rDesc')?.value || r.desc;
      addAuditLog('Role updated', `Updated role template ${name}`, r.id, 'Previous template', name);
      navigate('role-details'); showToast('Role updated');
    } else {
      state.roles.push({ id: `ROLE-0${state.roles.length + 1}`, name, depts: ['Sales Management'], summary: 'Configured screen & action permissions', status: 'Active', desc: document.getElementById('rDesc')?.value || '' });
      navigate('roles-list'); showToast(`${name} saved`);
    }
  } else if (act === 'save-assign-role') {
    const emp = getEmp(btn.dataset.id);
    document.querySelectorAll('[data-dept-role]').forEach((el) => { emp.deptRoles[el.dataset.deptRole] = el.value; });
    addAuditLog('Permissions updated', 'Updated department role assignments', `${emp.name} (${emp.id})`, 'Previous roles', JSON.stringify(emp.deptRoles));
    navigate('employee-details'); showToast('Roles assigned');
  } else if (act === 'perm-preset') {
    const emp = getEmp(state.selected.empId);
    const dept = btn.dataset.dept;
    if (!emp.permissions[dept]) emp.permissions[dept] = {};
    (DEPT_SCREENS[dept] || []).forEach((sc) => {
      emp.permissions[dept][sc] = btn.dataset.val === 'all' ? { view: true, create: true, edit: true, process: true } : btn.dataset.val === 'view' ? { view: true, create: false, edit: false, process: false } : { view: false, create: false, edit: false, process: false };
    });
    renderAll(); showToast(`Applied ${btn.dataset.val} preset`);
  } else if (act === 'confirm-perms') {
    const emp = getEmp(btn.dataset.id);
    addAuditLog('Permissions updated', 'Saved screen & workflow permissions', `${emp.name} (${emp.id})`, 'Previous matrix', 'Updated permissions applied');
    navigate('employee-details'); showToast('Permissions saved & logged');
  } else if (act === 'save-create-acc') {
    const emp = getEmp(document.getElementById('caEmp')?.value);
    emp.accountStatus = 'Active'; emp.accountCreated = '2026-11-20'; emp.pwdResetRequired = true;
    addAuditLog('Login account created', 'Enabled shared Cryo ERP login', `${emp.name} (${emp.id})`, 'Login Not Created', 'Active (Temp Pwd)');
    navigate('account-details', { key: 'empId', val: emp.id }); showToast(`Login account created for ${emp.name}`);
  } else if (act === 'confirm-reset-pwd') {
    const emp = getEmp(btn.dataset.id);
    addAuditLog('Password reset', 'Initiated secure password reset', `${emp.name} (${emp.id})`, '—', 'Reset required on next login');
    navigate('account-details'); showToast('Password reset confirmed');
  } else if (act === 'confirm-toggle-acc') {
    const emp = getEmp(btn.dataset.id);
    const next = emp.accountStatus === 'Active' ? 'Inactive' : 'Active';
    emp.accountStatus = next;
    addAuditLog(next === 'Active' ? 'Account activated' : 'Account deactivated', next === 'Active' ? 'Restored account access' : 'Revoked active sessions & preserved history', `${emp.name} (${emp.id})`, next === 'Active' ? 'Inactive' : 'Active', next);
    state.activeSheet = null; navigate('account-details'); showToast(`Account ${next}`);
  } else if (act === 'enter-dept') {
    state.currentDept = btn.dataset.val;
    navigate('dashboard'); showToast(`Opened ${btn.dataset.val}`);
  } else if (act === 'set-ui-state') { state.uiStateDemo = btn.dataset.val; renderAll(); }
});

renderAll();
</script>
</body>
</html>
